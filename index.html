*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:var(--obsidian);color:var(--text-main);font-family:var(--font-body)}body{display:flex;flex-direction:column}#header{flex:0 0 auto;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.15)),var(--dirt-dark);border-bottom:4px solid var(--gold-dark);padding:10px 14px;display:flex;align-items:center;gap:10px}#header .logo{font-family:var(--font-pixel);font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap}#header .logo:before{content:'\26cf\fe0e '}#hdr-info{flex:1;background:rgba(0,0,0,.45);border:2px solid var(--panel-border);border-radius:3px;padding:6px 10px;font-size:12px;color:var(--emerald);text-align:center;font-family:monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error{display:none;font-family:var(--font-pixel);font-size:11px;color:#fff;padding:10px 14px;text-align:center;flex:0 0 auto;text-shadow:1px 1px 0 #000;background:#c0392b}.error.show{display:block}#stage{flex:1;position:relative;overflow:hidden;min-height:0}#map-area{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at center,#12233a 0%,#060a12 100%)}#map-img{position:absolute;image-rendering:pixelated;display:block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}#tap-mark,#jump-mark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:10}#tap-mark{width:22px;height:22px}#tap-mark:before,#tap-mark:after{content:'';position:absolute;background:var(--emerald)}#tap-mark:before{left:50%;top:0;width:3px;height:100%;transform:translateX(-50%)}#tap-mark:after{top:50%;left:0;width:100%;height:3px;transform:translateY(-50%)}#jump-mark{width:26px;height:26px;z-index:15}#jump-mark:before,#jump-mark:after{content:'';position:absolute;background:var(--redstone);border-radius:1px;box-shadow:0 0 6px rgba(192,57,43,.8)}#jump-mark:before{left:50%;top:0;width:4px;height:26px;transform:translateX(-50%)}#jump-mark:after{top:50%;left:0;width:26px;height:4px;transform:translateY(-50%)}.player-mark{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:20}.player-mark .label{font-family:var(--font-pixel);font-size:8px;color:#fff;background:rgba(0,0,0,.75);padding:3px 6px;border-radius:2px;margin-bottom:4px;white-space:nowrap;border:1px solid var(--gold-dark)}.player-mark .icon{width:32px;height:32px;border:3px solid var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;position:relative;overflow:hidden;box-shadow:0 0 10px rgba(240,196,25,.5),0 3px 6px rgba(0,0,0,.5)}.player-mark .icon img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;pointer-events:none}#tooltip{position:absolute;background:rgba(10,14,10,.95);border:2px solid var(--emerald);color:var(--emerald);font-family:var(--font-pixel);font-size:9px;padding:6px 10px;border-radius:3px;pointer-events:none;display:none;z-index:30;white-space:nowrap}#zoom-controls{position:absolute;right:12px;bottom:185px;z-index:25;display:flex;flex-direction:column;gap:6px}.zoom-btn{width:44px;height:44px;font-family:var(--font-pixel);font-size:20px;color:#fff;background:var(--stone);border-top:3px solid #c9c9c9;border-left:3px solid #c9c9c9;border-right:3px solid #4a4a4a;border-bottom:3px solid #4a4a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.zoom-btn:active{border-top-color:#4a4a4a;border-left-color:#4a4a4a;border-right-color:#c9c9c9;border-bottom-color:#c9c9c9}#panel{position:absolute;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.1)),var(--panel-bg);border-top:4px solid var(--panel-border);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:88%}#panel-handle{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 12px 4px;cursor:grab;touch-action:none;user-select:none}.handle-bar{width:46px;height:5px;border-radius:3px;background:var(--panel-border)}.handle-label{font-family:var(--font-pixel);font-size:7px;color:var(--text-dim);min-height:9px}.tabs{display:flex;gap:8px;padding:0 12px;margin:4px 0 8px;flex:0 0 auto}.tab-btn{flex:1;font-family:var(--font-pixel);font-size:11px;padding:12px 8px;color:#cfd6c4;background:var(--stone-dark);border-top:3px solid #6e6e6e;border-left:3px solid #6e6e6e;border-right:3px solid #2c2c2c;border-bottom:5px solid #2c2c2c;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}.tab-btn.active{color:#fff;background:var(--grass);border-top-color:#9ed46e;border-left-color:#9ed46e;border-right-color:var(--grass-dark);border-bottom-color:var(--grass-dark);box-shadow:0 0 14px rgba(111,174,62,.55);transform:translateY(-1px)}.tab-content{display:none;flex-direction:column;gap:8px;padding:0 12px 8px;flex:0 0 auto}.tab-content.active{display:flex}.field-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.field-group{display:flex;flex-direction:column;gap:4px}.field-label{font-family:var(--font-pixel);font-size:8px;color:var(--gold)}input[type=number]{background:#0a0d08;border:2px solid var(--panel-border);color:var(--text-main);font-size:15px;padding:8px 10px;border-radius:2px;width:100px}.action-btn{font-family:var(--font-pixel);font-size:10px;color:#fff;padding:10px 14px;text-shadow:1px 1px 0 #000;cursor:pointer;background:var(--grass);border-top:3px solid #9ed46e;border-left:3px solid #9ed46e;border-right:3px solid var(--grass-dark);border-bottom:3px solid var(--grass-dark)}.action-btn.danger{background:var(--redstone);border-top-color:#e0685a;border-left-color:#e0685a;border-right-color:var(--redstone-dark);border-bottom-color:var(--redstone-dark)}.action-btn.jump{background:#2a7f92;border-top-color:var(--diamond);border-left-color:var(--diamond);border-right-color:#1a4f5c;border-bottom-color:#1a4f5c}.info-chip{font-size:12px;background:rgba(0,0,0,.4);border:2px solid var(--panel-border);color:var(--text-dim);padding:6px 10px;border-radius:3px}#panel-detail{flex:0 0 auto;overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.2,.8,.2,1)}#panel-detail.expanded{overflow-y:auto;-webkit-overflow-scrolling:touch}#live-player-list{display:flex;flex-direction:column;gap:6px;padding:4px 12px 0}.live-list-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border:2px solid var(--panel-border);border-radius:4px;padding:6px 10px;cursor:pointer}.avatar{width:28px;height:28px;border-radius:3px;border:2px solid var(--emerald);flex-shrink:0;background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.info{display:flex;flex-direction:column;gap:1px;min-width:0}.mcid{font-size:13px;font-weight:700;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.coords{font-size:11px;color:var(--text-dim)}.live-list-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:14px 0}#outside-section{padding:0 12px 16px}.section-divider{height:2px;background:var(--panel-border);margin:12px 0 10px}.section-title-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.section-title-text{font-family:var(--font-pixel);font-size:10px;color:var(--gold);flex:1}.outside-list-item{border-color:var(--gold-dark)}.outside-list-item .avatar{border-color:var(--gold-dark)}.outside-list-item .coords{color:var(--gold)}.live-mark .icon{border-color:var(--emerald);box-shadow:0 0 10px rgba(46,204,113,.7)}.live-mark .icon:after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--emerald);animation:liveBlink 1.2s ease-in-out infinite}@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.3}}
</style>

<body>
<div id="header"><div class="logo">麺Earth</div><div id="hdr-info">マップをタップしてください</div></div>
<div id="error-banner" class="error"></div>
<div id="stage"><div id="map-area"><img id="map-img" src="map-image.jpg" alt="map"><div id="tap-mark"></div><div id="jump-mark"></div><div id="tooltip"></div><div id="zoom-controls"><button type="button" class="zoom-btn" id="zoom-in">+</button><button type="button" class="zoom-btn" id="zoom-out">&minus;</button></div></div>
<div id="panel"><div id="panel-handle"><div class="handle-bar"></div><div class="handle-label" id="handle-label">上にスワイプで一覧表示</div></div><div class="tabs"><button type="button" class="tab-btn active" data-tab="live" id="tab-btn-players"><span class="tab-icon">&#128100;</span>プレイヤー</button><button type="button" class="tab-btn" data-tab="jump" id="tab-btn-jump"><span class="tab-icon">&#127919;</span>ジャンプ</button></div>
<div class="tab-content active" id="tab-live"><div class="field-row"><button type="button" class="action-btn" id="btn-live-toggle">ライブ表示: OFF</button><div class="info-chip" id="live-status">未接続</div></div><div class="field-row"><div class="info-chip" id="live-count">プレイヤー: 0人</div></div></div>
<div class="tab-content" id="tab-jump"><div class="field-row"><div class="field-group"><div class="field-label">MC X</div><input type="number" id="input-jx" placeholder="7152"></div><div class="field-group"><div class="field-label">MC Z</div><input type="number" id="input-jz" placeholder="-1820"></div><button type="button" class="action-btn jump" id="btn-jump">ジャンプ</button></div></div>
<div id="panel-detail"><div id="live-player-list"></div><div id="outside-section" style="display:none"><div class="section-divider"></div><div class="section-title-row"><span style="font-size:14px">&#127757;</span><span class="section-title-text">マップ外に出た記録</span><span class="info-chip" id="outside-count">0人</span></div><div id="outside-player-list"></div></div></div></div></div>
<script>
'use strict';
const WORKER_API='https://api.menearth.com';
const MAP_BOUNDS={x1:-9215,z1:-4607,x2:9215,z2:4607};
const IMG_W=1539,IMG_H=769,CONV={cx:51.26,ox:-4,cz:51.22,oz:1};
function mcToGeo(x,z){return{lat:(-(z-CONV.oz)/CONV.cz).toFixed(4),lng:((x-CONV.ox)/CONV.cx).toFixed(4)}}
const view={x:0,y:0,scale:1};const mapArea=document.getElementById('map-area'),mapImg=document.getElementById('map-img'),tapMark=document.getElementById('tap-mark'),jumpMark=document.getElementById('jump-mark'),tooltip=document.getElementById('tooltip'),hdrInfo=document.getElementById('hdr-info'),errorBanner=document.getElementById('error-banner');
let errorTimer=null;function showError(msg){errorBanner.textContent=msg;errorBanner.classList.add('show');if(errorTimer)clearTimeout(errorTimer);errorTimer=setTimeout(()=>errorBanner.classList.remove('show'),5000)}
function fitView(){const r=mapArea.getBoundingClientRect(),ph=document.getElementById('panel').getBoundingClientRect().height||0;if(r.width<=0||r.height<=0)return;const ah=Math.max(r.height-ph,100);view.scale=Math.min(r.width/IMG_W,ah/IMG_H);view.x=(r.width-IMG_W*view.scale)/2;view.y=(ah-IMG_H*view.scale)/2;applyView()}
function applyView(){mapImg.style.width=IMG_W*view.scale+'px';mapImg.style.height=IMG_H*view.scale+'px';mapImg.style.left=view.x+'px';mapImg.style.top=view.y+'px';updateAllMarkers()}
function clampView(){const r=mapArea.getBoundingClientRect(),ph=document.getElementById('panel').getBoundingClientRect().height||0,ah=Math.max(r.height-ph,100),cw=IMG_W*view.scale,ch=IMG_H*view.scale;if(cw<=r.width)view.x=(r.width-cw)/2;else view.x=Math.min(0,Math.max(r.width-cw,view.x));if(ch<=ah)view.y=(ah-ch)/2;else view.y=Math.min(0,Math.max(ah-ch,view.y))}
function mcToPixel(x,z){return{x:view.x+(x-MAP_BOUNDS.x1)/(MAP_BOUNDS.x2-MAP_BOUNDS.x1)*IMG_W*view.scale,y:view.y+(z-MAP_BOUNDS.z1)/(MAP_BOUNDS.z2-MAP_BOUNDS.z1)*IMG_H*view.scale}}
function pixelToMc(px,py){return{x:Math.round(MAP_BOUNDS.x1+(px-view.x)/(IMG_W*view.scale)*(MAP_BOUNDS.x2-MAP_BOUNDS.x1)),z:Math.round(MAP_BOUNDS.z1+(py-view.y)/(IMG_H*view.scale)*(MAP_BOUNDS.z2-MAP_BOUNDS.z1))}}
function isInsideMapBounds(x,z){return x>=MAP_BOUNDS.x1&&x<=MAP_BOUNDS.x2&&z>=MAP_BOUNDS.z1&&z<=MAP_BOUNDS.z2}
let currentJumpMc=null;function updateAllMarkers(){if(currentJumpMc&&jumpMark.style.display!=='none'){const p=mcToPixel(currentJumpMc.x,currentJumpMc.z);jumpMark.style.left=p.x+'px';jumpMark.style.top=p.y+'px'}updateLiveMarkerPositions()}
let tooltipTimer=null;function onMapTap(cx,cy){const r=mapArea.getBoundingClientRect(),lx=cx-r.left,ly=cy-r.top;if(lx<view.x||lx>view.x+IMG_W*view.scale||ly<view.y||ly>view.y+IMG_H*view.scale)return;tapMark.style.display='block';tapMark.style.left=lx+'px';tapMark.style.top=ly+'px';const mc=pixelToMc(lx,ly),geo=mcToGeo(mc.x,mc.z);hdrInfo.textContent='X:'+mc.x+' Z:'+mc.z+' | '+geo.lat+'°N '+geo.lng+'°E';tooltip.textContent='X:'+mc.x+' Z:'+mc.z;tooltip.style.display='block';let tx=lx+12,ty=ly-30;if(tx+150>r.width)tx=lx-160;if(ty<0)ty=ly+14;tooltip.style.left=tx+'px';tooltip.style.top=ty+'px';if(tooltipTimer)clearTimeout(tooltipTimer);tooltipTimer=setTimeout(()=>tooltip.style.display='none',2500)}
function doJumpTo(){const x=parseFloat(document.getElementById('input-jx').value),z=parseFloat(document.getElementById('input-jz').value);if(isNaN(x)||isNaN(z)){showError('X座標とZ座標を数字で入力してください。');return}currentJumpMc={x,z};zoomToMcCoord(x,z,4);const geo=mcToGeo(x,z);hdrInfo.textContent='X:'+x+' Z:'+z+' | '+geo.lat+'°N '+geo.lng+'°E';jumpMark.style.display='block';const p=mcToPixel(x,z);jumpMark.style.left=p.x+'px';jumpMark.style.top=p.y+'px'}
function zoomToMcCoord(x,z,target){const r=mapArea.getBoundingClientRect(),ph=document.getElementById('panel').getBoundingClientRect().height||0,ah=Math.max(r.height-ph,100),min=Math.min(r.width/IMG_W,ah/IMG_H),ns=Math.min(Math.max(target,min),15),rx=(x-MAP_BOUNDS.x1)/(MAP_BOUNDS.x2-MAP_BOUNDS.x1),rz=(z-MAP_BOUNDS.z1)/(MAP_BOUNDS.z2-MAP_BOUNDS.z1);view.x=r.width/2-rx*IMG_W*ns;view.y=ah/2-rz*IMG_H*ns;view.scale=ns;clampView();applyView();setDetailExpanded(false)}
const panelDetail=document.getElementById('panel-detail'),handleLabel=document.getElementById('handle-label'),panelHandle=document.getElementById('panel-handle');let detailExpanded=false;function detailMaxPx(){return Math.max(100,Math.round(document.getElementById('stage').getBoundingClientRect().height*.58))}function setDetailExpanded(exp){detailExpanded=exp;if(exp){panelDetail.style.maxHeight=detailMaxPx()+'px';panelDetail.classList.add('expanded');handleLabel.textContent='下にスワイプで閉じる'}else{panelDetail.style.maxHeight='0px';panelDetail.classList.remove('expanded');handleLabel.textContent='上にスワイプで一覧表示'}setTimeout(fitView,350)}
let hDragging=false,hMoved=false,hStartY=0,hStartH=0,hMaxPx=0;function hDragStart(y){if(!document.getElementById('tab-live').classList.contains('active'))return;hDragging=true;hMoved=false;hStartY=y;hStartH=panelDetail.getBoundingClientRect().height;hMaxPx=detailMaxPx();panelDetail.style.transition='none';panelDetail.classList.add('expanded')}function hDragMove(y){if(!hDragging)return;const dy=hStartY-y;if(Math.abs(dy)>6)hMoved=true;panelDetail.style.maxHeight=Math.min(Math.max(hStartH+dy,0),hMaxPx)+'px';fitView()}function hDragEnd(){if(!hDragging)return;hDragging=false;panelDetail.style.transition='';if(!hMoved){setDetailExpanded(!detailExpanded);return}setDetailExpanded(panelDetail.getBoundingClientRect().height>hMaxPx*.3)}panelHandle.addEventListener('touchstart',e=>hDragStart(e.touches[0].clientY),{passive:true});panelHandle.addEventListener('touchmove',e=>{if(!hDragging)return;e.preventDefault();hDragMove(e.touches[0].clientY)},{passive:false});panelHandle.addEventListener('touchend',hDragEnd);panelHandle.addEventListener('touchcancel',hDragEnd);panelHandle.addEventListener('mousedown',e=>{hDragStart(e.clientY);const mm=e2=>hDragMove(e2.clientY),mu=()=>{hDragEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu)});
function switchTab(name){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');setDetailExpanded(false);if(name==='jump'){panelDetail.style.display='none';panelHandle.style.opacity='.4';handleLabel.textContent=''}else{panelDetail.style.display='';panelHandle.style.opacity='1'}}document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
let pointers={},panActive=false,panLastX=0,panLastY=0,pinchActive=false,pinchDist=0,pinchMidX=0,pinchMidY=0,isTap=false,tapStartX=0,tapStartY=0,tapStartTime=0;function onTouchStart(e){if(e.target.closest('#zoom-controls')||e.target.closest('#panel'))return;e.preventDefault();for(const t of e.changedTouches)pointers[t.identifier]={x:t.clientX,y:t.clientY};const k=Object.keys(pointers);if(k.length===1){const p=pointers[k[0]];panActive=true;pinchActive=false;panLastX=p.x;panLastY=p.y;isTap=true;tapStartX=p.x;tapStartY=p.y;tapStartTime=Date.now()}else if(k.length===2){panActive=false;pinchActive=true;isTap=false;const a=pointers[k[0]],b=pointers[k[1]];pinchDist=Math.hypot(b.x-a.x,b.y-a.y);pinchMidX=(a.x+b.x)/2;pinchMidY=(a.y+b.y)/2}}function onTouchMove(e){if(e.target.closest('#panel'))return;e.preventDefault();for(const t of e.changedTouches)pointers[t.identifier]={x:t.clientX,y:t.clientY};const k=Object.keys(pointers);if(k.length===1&&panActive){const p=pointers[k[0]],dx=p.x-panLastX,dy=p.y-panLastY;if(Math.abs(dx)>3||Math.abs(dy)>3)isTap=false;view.x+=dx;view.y+=dy;panLastX=p.x;panLastY=p.y;clampView();applyView()}else if(k.length===2&&pinchActive){const a=pointers[k[0]],b=pointers[k[1]],dist=Math.hypot(b.x-a.x,b.y-a.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,r=mapArea.getBoundingClientRect(),ph=document.getElementById('panel').getBoundingClientRect().height||0,ah=Math.max(r.height-ph,100),min=Math.min(r.width/IMG_W,ah/IMG_H),ns=Math.min(Math.max(view.scale*dist/pinchDist,min),15),ox=pinchMidX-r.left,oy=pinchMidY-r.top;view.x=ox-(ox-view.x)*(ns/view.scale);view.y=oy-(oy-view.y)*(ns/view.scale);view.scale=ns;view.x+=mx-pinchMidX;view.y+=my-pinchMidY;pinchDist=dist;pinchMidX=mx;pinchMidY=my;clampView();applyView()}}function onTouchEnd(e){for(const t of e.changedTouches)delete pointers[t.identifier];const rem=Object.keys(pointers).length;if(rem===0){if(isTap&&Date.now()-tapStartTime<300)onMapTap(tapStartX,tapStartY);panActive=false;pinchActive=false;isTap=false}else if(rem===1){pinchActive=false;panActive=true;isTap=false;const p=pointers[Object.keys(pointers)[0]];panLastX=p.x;panLastY=p.y}}function onTouchCancel(e){for(const t of e.changedTouches)delete pointers[t.identifier];panActive=false;pinchActive=false;isTap=false}mapArea.addEventListener('touchstart',onTouchStart,{passive:false});mapArea.addEventListener('touchmove',onTouchMove,{passive:false});mapArea.addEventListener('touchend',onTouchEnd,{passive:false});mapArea.addEventListener('touchcancel',onTouchCancel,{passive:false});
let mouseDragging=false,mouseLastX=0,mouseLastY=0,mouseMoved=false;mapArea.addEventListener('click',e=>{if(e.target.closest('#zoom-controls')||e.target.closest('#panel'))return;if(mouseMoved){mouseMoved=false;return}onMapTap(e.clientX,e.clientY)});mapArea.addEventListener('mousedown',e=>{if(e.target.closest('#zoom-controls')||e.target.closest('#panel'))return;mouseDragging=true;mouseMoved=false;mouseLastX=e.clientX;mouseLastY=e.clientY});window.addEventListener('mousemove',e=>{if(!mouseDragging)return;const dx=e.clientX-mouseLastX,dy=e.clientY-mouseLastY;if(Math.abs(dx)>3||Math.abs(dy)>3)mouseMoved=true;view.x+=dx;view.y+=dy;mouseLastX=e.clientX;mouseLastY=e.clientY;clampView();applyView()});window.addEventListener('mouseup',()=>mouseDragging=false);mapArea.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});function zoomAt(cx,cy,f){const r=mapArea.getBoundingClientRect(),ph=document.getElementById('panel').getBoundingClientRect().height||0,ah=Math.max(r.height-ph,100),min=Math.min(r.width/IMG_W,ah/IMG_H),ns=Math.min(Math.max(view.scale*f,min),15),ox=cx-r.left,oy=cy-r.top;view.x=ox-(ox-view.x)*(ns/view.scale);view.y=oy-(oy-view.y)*(ns/view.scale);view.scale=ns;clampView();applyView()}function zoomBy(f){const r=mapArea.getBoundingClientRect(),ph=document.getElementById('panel').getBoundingClientRect().height||0,ah=Math.max(r.height-ph,100);zoomAt(r.left+r.width/2,r.top+ah/2,f)}function bindZoomBtn(el,f){let fired=false;const trigger=e=>{e.preventDefault();e.stopPropagation();if(fired)return;fired=true;zoomBy(f);setTimeout(()=>fired=false,150)};el.addEventListener('touchstart',trigger,{passive:false});el.addEventListener('mousedown',trigger);el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()})}bindZoomBtn(document.getElementById('zoom-in'),1.4);bindZoomBtn(document.getElementById('zoom-out'),1/1.4);document.getElementById('btn-jump').addEventListener('click',doJumpTo);
async function api(path,options={}){const r=await fetch(WORKER_API+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(data&&data.error?data.error:`HTTP ${r.status}`);return data}
function hueFromString(s){let h=0;for(let i=0;i<s.length;i++)h=(h+s.charCodeAt(i)*7)%360;return h}
let liveActive=false,liveMarkers={},liveTimer=null,outsideHistory={},outsideTimer=null;const liveToggleBtn=document.getElementById('btn-live-toggle'),liveStatusChip=document.getElementById('live-status'),liveCountChip=document.getElementById('live-count'),livePlayerListEl=document.getElementById('live-player-list'),outsideSectionEl=document.getElementById('outside-section'),outsidePlayerListEl=document.getElementById('outside-player-list'),outsideCountEl=document.getElementById('outside-count');
function upsertLiveMarker(id,x,z){let e=liveMarkers[id];if(!e){const el=document.createElement('div');el.className='player-mark live-mark';const lb=document.createElement('div');lb.className='label';lb.textContent=id;const ic=document.createElement('div');ic.className='icon';ic.style.background=`hsl(${hueFromString(id)},55%,40%)`;ic.textContent=id.charAt(0).toUpperCase();const ai=new Image();ai.alt=id;ai.onload=()=>{ic.textContent='';ic.appendChild(ai)};ai.src='https://crafatar.com/avatars/'+encodeURIComponent(id)+'?size=32&overlay';el.append(lb,ic);mapArea.appendChild(el);e={el};liveMarkers[id]=e}e.x=x;e.z=z;const p=mcToPixel(x,z);e.el.style.left=p.x+'px';e.el.style.top=p.y+'px'}function removeLiveMarker(id){const e=liveMarkers[id];if(!e)return;e.el.remove();delete liveMarkers[id]}function clearAllLiveMarkers(){Object.keys(liveMarkers).forEach(removeLiveMarker)}function updateLiveMarkerPositions(){Object.values(liveMarkers).forEach(e=>{const p=mcToPixel(e.x,e.z);e.el.style.left=p.x+'px';e.el.style.top=p.y+'px'})}
function buildPlayerListItem(id,p){const item=document.createElement('div');item.className='live-list-item';const av=document.createElement('div');av.className='avatar';av.style.background=`hsl(${hueFromString(id)},55%,40%)`;av.textContent=id.charAt(0).toUpperCase();const ai=new Image();ai.alt=id;ai.onload=()=>{av.textContent='';av.appendChild(ai)};ai.src='https://crafatar.com/avatars/'+encodeURIComponent(id)+'?size=28&overlay';const info=document.createElement('div');info.className='info';const ne=document.createElement('div');ne.className='mcid';ne.textContent=id;const co=document.createElement('div');co.className='coords';co.textContent=`X: ${Math.round(p.x)}  Z: ${Math.round(p.z)}`;info.append(ne,co);item.append(av,info);item.addEventListener('click',()=>zoomToMcCoord(p.x,p.z,6));return item}
function renderLivePlayerList(data){livePlayerListEl.innerHTML='';const ids=Object.keys(data||{}).filter(id=>data[id]&&typeof data[id].x==='number'&&typeof data[id].z==='number'&&isInsideMapBounds(data[id].x,data[id].z)).sort();if(!ids.length){const e=document.createElement('div');e.className='live-list-empty';e.textContent='オンラインのプレイヤーがいません';livePlayerListEl.appendChild(e)}else ids.forEach(id=>livePlayerListEl.appendChild(buildPlayerListItem(id,data[id])))}
function formatTime(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
function renderOutsideHistory(){outsidePlayerListEl.innerHTML='';const ids=Object.keys(outsideHistory);if(!ids.length){outsideSectionEl.style.display='none';return}outsideSectionEl.style.display='block';outsideCountEl.textContent=ids.length+'人';ids.sort((a,b)=>outsideHistory[b].time-outsideHistory[a].time);ids.forEach(id=>{const r=outsideHistory[id],item=document.createElement('div');item.className='live-list-item outside-list-item';const av=document.createElement('div');av.className='avatar';av.style.background=`hsl(${hueFromString(id)},55%,40%)`;av.textContent=id.charAt(0).toUpperCase();const info=document.createElement('div');info.className='info';const ne=document.createElement('div');ne.className='mcid';ne.textContent=id;const co=document.createElement('div');co.className='coords';co.textContent=`X: ${Math.round(r.x)}  Z: ${Math.round(r.z)}  ${formatTime(r.time)} に検出`;info.append(ne,co);item.append(av,info);item.addEventListener('click',()=>zoomToMcCoord(Math.min(Math.max(r.x,MAP_BOUNDS.x1),MAP_BOUNDS.x2),Math.min(Math.max(r.z,MAP_BOUNDS.z1),MAP_BOUNDS.z2),2));outsidePlayerListEl.appendChild(item)})}
async function refreshOutside(){try{const raw=await api('/api/outside_history');outsideHistory={};Object.keys(raw||{}).forEach(id=>{const r=raw[id];if(r&&typeof r.x==='number'&&typeof r.z==='number'&&r.time)outsideHistory[id]={x:r.x,z:r.z,time:new Date(r.time)}});renderOutsideHistory()}catch(e){showError('マップ外記録の取得に失敗: '+e.message)}}
async function refreshLive(){try{const data=await api('/api/players');const seen={};Object.keys(data||{}).forEach(id=>{const p=data[id];if(!p||typeof p.x!=='number'||typeof p.z!=='number')return;seen[id]=true;if(isInsideMapBounds(p.x,p.z))upsertLiveMarker(id,p.x,p.z);else removeLiveMarker(id)});Object.keys(liveMarkers).forEach(id=>{if(!seen[id])removeLiveMarker(id)});renderLivePlayerList(data||{});liveStatusChip.textContent='接続中（Worker経由）';liveCountChip.textContent='プレイヤー: '+Object.keys(seen).length+'人'}catch(e){liveStatusChip.textContent='接続エラー';showError('プレイヤー情報の取得に失敗: '+e.message)}}
function startLive(){if(liveTimer)clearInterval(liveTimer);liveStatusChip.textContent='接続中...';refreshLive();liveTimer=setInterval(refreshLive,2000)}function stopLive(){if(liveTimer)clearInterval(liveTimer);liveTimer=null;clearAllLiveMarkers();livePlayerListEl.innerHTML='';liveStatusChip.textContent='未接続';liveCountChip.textContent='プレイヤー: 0人'}liveToggleBtn.addEventListener('click',()=>{liveActive=!liveActive;if(liveActive){liveToggleBtn.textContent='ライブ表示: ON';liveToggleBtn.classList.add('danger');startLive()}else{liveToggleBtn.textContent='ライブ表示: OFF';liveToggleBtn.classList.remove('danger');stopLive()}});document.getElementById('tab-btn-players').addEventListener('click',()=>{if(!liveActive){liveActive=true;liveToggleBtn.textContent='ライブ表示: ON';liveToggleBtn.classList.add('danger');startLive()}});
window.addEventListener('resize',fitView);window.addEventListener('load',()=>{fitView();setTimeout(fitView,50);setTimeout(fitView,200);refreshOutside();outsideTimer=setInterval(refreshOutside,5000)});if(mapImg.complete)fitView();else mapImg.addEventListener('load',fitView);
</script>
