<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>麺Earth MAP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700;900&display=swap');
:root{
  --grass:#6fae3e;--grass-dark:#4f7f2c;--dirt-dark:#5c4a33;--stone:#8a8a8a;
  --stone-dark:#545454;--obsidian:#0d0f0d;--panel-bg:#1a1d16;--panel-border:#3a3f2e;
  --gold:#f0c419;--gold-dark:#b8941a;--diamond:#4fd1e8;--redstone:#c0392b;
  --redstone-dark:#7a1f16;--emerald:#2ecc71;--text-main:#e8e6d8;--text-dim:#8a9478;
  --font-pixel:'Press Start 2P',monospace;--font-body:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:var(--obsidian);color:var(--text-main);font-family:var(--font-body)}body{display:flex;flex-direction:column}
#header{flex:0 0 auto;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.15)),var(--dirt-dark);border-bottom:4px solid var(--gold-dark);padding:10px 14px;display:flex;align-items:center;gap:10px}
#header .logo{font-family:var(--font-pixel);font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap}
#header .logo:before{content:'\26cf\fe0e '}
#hdr-info{flex:1;background:rgba(0,0,0,.45);border:2px solid var(--panel-border);border-radius:3px;padding:6px 10px;font-size:12px;color:var(--emerald);text-align:center;font-family:monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.error{display:none;font-family:var(--font-pixel);font-size:11px;color:#fff;padding:10px 14px;text-align:center;flex:0 0 auto;text-shadow:1px 1px 0 #000;background:#c0392b}
.error.show{display:block}
#stage{flex:1;position:relative;overflow:hidden;min-height:0}
#map-area{position:absolute;inset:0;overflow:hidden;background:#0a1520}
#map-img{position:absolute;image-rendering:pixelated;display:block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}
#chunk-canvas{position:absolute;top:0;left:0;display:block;cursor:crosshair}
#tap-mark,#jump-mark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:10}
#tap-mark{width:22px;height:22px}
#tap-mark:before,#tap-mark:after{content:'';position:absolute;background:var(--emerald)}
#tap-mark:before{left:50%;top:0;width:3px;height:100%;transform:translateX(-50%)}
#tap-mark:after{top:50%;left:0;width:100%;height:3px;transform:translateY(-50%)}
#jump-mark{width:26px;height:26px;z-index:15}
#jump-mark:before,#jump-mark:after{content:'';position:absolute;background:var(--redstone);border-radius:1px;box-shadow:0 0 6px rgba(192,57,43,.8)}
#jump-mark:before{left:50%;top:0;width:4px;height:26px;transform:translateX(-50%)}
#jump-mark:after{top:50%;left:0;width:26px;height:4px;transform:translateY(-50%)}
.player-mark{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:20}
.player-mark .label{font-family:var(--font-pixel);font-size:8px;color:#fff;background:rgba(0,0,0,.75);padding:3px 6px;border-radius:2px;margin-bottom:4px;white-space:nowrap;border:1px solid var(--gold-dark)}
.player-mark .icon{width:32px;height:32px;border:3px solid var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;position:relative;overflow:hidden;box-shadow:0 0 10px rgba(240,196,25,.5),0 3px 6px rgba(0,0,0,.5)}
.player-mark .icon img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;pointer-events:none}
#tooltip{position:absolute;background:rgba(10,14,10,.95);border:2px solid var(--emerald);color:var(--emerald);font-family:var(--font-pixel);font-size:9px;padding:6px 10px;border-radius:3px;pointer-events:none;display:none;z-index:30;white-space:nowrap}
#country-popup{position:absolute;background:rgba(10,14,10,.98);border:2px solid var(--gold);color:var(--text-main);font-family:var(--font-body);font-size:14px;padding:12px 16px 10px;border-radius:4px;z-index:35;text-align:center;min-width:140px;display:none}
#country-popup .country-name{font-family:var(--font-pixel);font-size:11px;color:var(--gold);margin-bottom:6px}
#country-popup .chunk-count{font-size:12px;color:var(--text-dim);margin-bottom:8px}
#country-popup .popup-close{font-family:var(--font-pixel);font-size:10px;color:#fff;background:var(--stone-dark);border:2px solid #6e6e6e;padding:4px 10px;cursor:pointer;border-radius:2px}
#zoom-controls{position:absolute;right:12px;bottom:185px;z-index:25;display:flex;flex-direction:column;gap:6px}
.zoom-btn{width:44px;height:44px;font-family:var(--font-pixel);font-size:20px;color:#fff;background:var(--stone);border-top:3px solid #c9c9c9;border-left:3px solid #c9c9c9;border-right:3px solid #4a4a4a;border-bottom:3px solid #4a4a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zoom-btn:active{border-top-color:#4a4a4a;border-left-color:#4a4a4a;border-right-color:#c9c9c9;border-bottom-color:#c9c9c9}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.1)),var(--panel-bg);border-top:4px solid var(--panel-border);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:88%}
#panel-handle{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 12px 4px;cursor:grab;touch-action:none;user-select:none}
.handle-bar{width:46px;height:5px;border-radius:3px;background:var(--panel-border)}
.handle-label{font-family:var(--font-pixel);font-size:7px;color:var(--text-dim);min-height:9px}
.tabs{display:flex;gap:6px;padding:0 12px;margin:4px 0 8px;flex:0 0 auto;flex-wrap:wrap}
.tab-btn{flex:1;min-width:60px;font-family:var(--font-pixel);font-size:10px;padding:10px 4px;color:#cfd6c4;background:var(--stone-dark);border-top:3px solid #6e6e6e;border-left:3px solid #6e6e6e;border-right:3px solid #2c2c2c;border-bottom:5px solid #2c2c2c;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tab-btn.active{color:#fff;background:var(--grass);border-top-color:#9ed46e;border-left-color:#9ed46e;border-right-color:var(--grass-dark);border-bottom-color:var(--grass-dark);box-shadow:0 0 14px rgba(111,174,62,.55);transform:translateY(-1px)}
.tab-content{display:none;flex-direction:column;gap:8px;padding:0 12px 8px;flex:0 0 auto}
.tab-content.active{display:flex}
.field-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-family:var(--font-pixel);font-size:8px;color:var(--gold)}
input[type=number]{background:#0a0d08;border:2px solid var(--panel-border);color:var(--text-main);font-size:15px;padding:8px 10px;border-radius:2px;width:100px}
.action-btn{font-family:var(--font-pixel);font-size:10px;color:#fff;padding:10px 14px;text-shadow:1px 1px 0 #000;cursor:pointer;background:var(--grass);border-top:3px solid #9ed46e;border-left:3px solid #9ed46e;border-right:3px solid var(--grass-dark);border-bottom:3px solid var(--grass-dark)}
.action-btn:active{border-top-color:var(--grass-dark);border-left-color:var(--grass-dark);border-right-color:#9ed46e;border-bottom-color:#9ed46e}
.action-btn.danger{background:var(--redstone);border-top-color:#e0685a;border-left-color:#e0685a;border-right-color:var(--redstone-dark);border-bottom-color:var(--redstone-dark)}
.action-btn.jump{background:#2a7f92;border-top-color:var(--diamond);border-left-color:var(--diamond);border-right-color:#1a4f5c;border-bottom-color:#1a4f5c}
.action-btn.gold{background:#8a6a00;border-top-color:var(--gold);border-left-color:var(--gold);border-right-color:#5a4400;border-bottom-color:#5a4400}
.action-btn.warn{background:#7a4800;border-top-color:#d08020;border-left-color:#d08020;border-right-color:#3a2000;border-bottom-color:#3a2000}
.action-btn.warn.active-warn{background:var(--redstone);border-top-color:#e0685a;border-left-color:#e0685a;border-right-color:var(--redstone-dark);border-bottom-color:var(--redstone-dark);box-shadow:0 0 12px rgba(192,57,43,.6)}
.action-btn:disabled{opacity:.45;cursor:not-allowed}
.info-chip{font-size:12px;background:rgba(0,0,0,.4);border:2px solid var(--panel-border);color:var(--text-dim);padding:6px 10px;border-radius:3px}
#panel-detail{flex:0 0 auto;overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.2,.8,.2,1)}
#panel-detail.expanded{overflow-y:auto;-webkit-overflow-scrolling:touch}
#live-player-list{display:flex;flex-direction:column;gap:6px;padding:4px 12px 12px}
.live-list-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border:2px solid var(--panel-border);border-radius:4px;padding:6px 10px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:3px;border:2px solid var(--emerald);flex-shrink:0;background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.info{display:flex;flex-direction:column;gap:1px;min-width:0}
.mcid{font-size:13px;font-weight:700;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coords{font-size:11px;color:var(--text-dim)}
.live-list-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:14px 0}
#country-list-wrap{display:flex;flex-direction:column;gap:6px;padding:4px 12px 12px}
.country-list-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border:2px solid var(--panel-border);border-radius:4px;padding:8px 10px;cursor:pointer}
.country-color-block{width:14px;height:14px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.country-item-name{flex:1;font-size:13px;font-weight:700;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country-item-count{font-size:11px;color:var(--text-dim);white-space:nowrap}
.country-list-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:14px 0}
.live-mark .icon{border-color:var(--emerald);box-shadow:0 0 10px rgba(46,204,113,.7)}
.live-mark .icon:after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--emerald);animation:liveBlink 1.2s ease-in-out infinite}
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.3}}
#render-canvas-wrap{width:100%;background:#000;border:2px solid var(--panel-border);border-radius:4px;overflow:hidden;position:relative}
#render-canvas{display:block;width:100%;image-rendering:pixelated}
#render-progress-bar{height:6px;background:var(--grass);width:0%;transition:width .2s}
.render-stat{font-family:monospace;font-size:11px;color:var(--text-dim);padding:4px 8px}
#border-toggle-btn{position:absolute;left:12px;bottom:185px;z-index:25;width:44px;height:44px;font-size:18px;background:var(--stone);border-top:3px solid #c9c9c9;border-left:3px solid #c9c9c9;border-right:3px solid #4a4a4a;border-bottom:3px solid #4a4a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .15s}
#border-toggle-btn.active{background:#2a5c1a;border-top-color:#6fae3e;border-left-color:#6fae3e;border-right-color:#1a3a0a;border-bottom-color:#1a3a0a;box-shadow:0 0 10px rgba(111,174,62,.5)}
#border-toggle-btn:active{border-top-color:#4a4a4a;border-left-color:#4a4a4a;border-right-color:#c9c9c9;border-bottom-color:#c9c9c9}
#unrendered-toggle-btn{position:absolute;left:12px;bottom:237px;z-index:25;width:44px;height:44px;font-size:18px;background:var(--stone);border-top:3px solid #c9c9c9;border-left:3px solid #c9c9c9;border-right:3px solid #4a4a4a;border-bottom:3px solid #4a4a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .15s}
#unrendered-toggle-btn.active{background:#7a1010;border-top-color:#e06060;border-left-color:#e06060;border-right-color:#3a0808;border-bottom-color:#3a0808;box-shadow:0 0 10px rgba(192,57,43,.6)}
#unrendered-toggle-btn:active{border-top-color:#4a4a4a;border-left-color:#4a4a4a;border-right-color:#c9c9c9;border-bottom-color:#c9c9c9}
#unrendered-legend{position:absolute;left:62px;bottom:246px;z-index:25;background:rgba(10,14,10,.9);border:2px solid var(--redstone);color:#fff;font-family:var(--font-pixel);font-size:8px;padding:4px 8px;border-radius:3px;pointer-events:none;display:none;white-space:nowrap}
#unrendered-legend.show{display:block}
</style>
</head>
<body>
<div id="header"><div class="logo">麺Earth</div><div id="hdr-info">マップをタップしてください</div></div>
<div id="error-banner" class="error"></div>

<div id="stage">
  <div id="map-area">
    <img id="map-img" src="" alt="map" style="display:block">
    <canvas id="chunk-canvas"></canvas>
    <div id="tap-mark"></div>
    <div id="jump-mark"></div>
    <div id="tooltip"></div>
    <div id="country-popup">
      <div class="country-name" id="popup-name"></div>
      <div class="chunk-count" id="popup-count"></div>
      <button type="button" class="popup-close" id="popup-close-btn">✕ 閉じる</button>
    </div>
    <div id="zoom-controls">
      <button type="button" class="zoom-btn" id="zoom-in">+</button>
      <button type="button" class="zoom-btn" id="zoom-out">&minus;</button>
    </div>
    <button type="button" id="unrendered-toggle-btn" title="ブロック未読込チャンク表示">🟥</button>
    <div id="unrendered-legend">ブロック未読込エリア</div>
    <button type="button" id="border-toggle-btn" title="国境オン/オフ">🗺</button>
  </div>

  <div id="panel">
    <div id="panel-handle">
      <div class="handle-bar"></div>
      <div class="handle-label" id="handle-label">上にスワイプで一覧表示</div>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="live"      id="tab-btn-players">&#128100; プレイヤー</button>
      <button type="button" class="tab-btn"        data-tab="countries" id="tab-btn-countries">&#127757; 国一覧</button>
      <button type="button" class="tab-btn"        data-tab="jump"      id="tab-btn-jump">&#127919; ジャンプ</button>
      <button type="button" class="tab-btn"        data-tab="render"    id="tab-btn-render">&#128444; 描画</button>
    </div>
    <div class="tab-content active" id="tab-live">
      <div class="field-row">
        <button type="button" class="action-btn" id="btn-live-toggle">ライブ表示: OFF</button>
        <div class="info-chip" id="live-status">未接続</div>
      </div>
      <div class="field-row">
        <div class="info-chip" id="live-count">プレイヤー: 0人</div>
      </div>
    </div>
    <div class="tab-content" id="tab-countries">
      <div class="info-chip" id="countries-count">読み込み中...</div>
    </div>
    <div class="tab-content" id="tab-jump">
      <div class="field-row">
        <div class="field-group"><div class="field-label">MC X</div><input type="number" id="input-jx" placeholder="7152"></div>
        <div class="field-group"><div class="field-label">MC Z</div><input type="number" id="input-jz" placeholder="-1820"></div>
        <button type="button" class="action-btn jump" id="btn-jump">ジャンプ</button>
      </div>
    </div>
    <div class="tab-content" id="tab-render">
      <div class="field-row">
        <button type="button" class="action-btn" id="btn-render-load">データ取得 &amp; 描画</button>
        <button type="button" class="action-btn gold" id="btn-render-save" disabled>PNG保存</button>
      </div>
      <div class="field-row">
        <button type="button" class="action-btn warn" id="btn-show-unrendered">🟥 ブロック未読込表示: OFF</button>
        <div class="info-chip" id="unrendered-stat">—</div>
      </div>
      <div class="info-chip render-stat" id="render-stat">未取得</div>
      <div id="render-progress-bar"></div>
    </div>
    <div id="panel-detail">
      <div id="live-player-list"></div>
      <div id="country-list-wrap" style="display:none"></div>
      <div id="render-canvas-wrap" style="display:none;padding:8px 12px 12px">
        <canvas id="render-canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const FIREBASE_URL = 'https://menearths4map-default-rtdb.asia-southeast1.firebasedatabase.app';
async function fbGet(path) {
  const res = await fetch(`${FIREBASE_URL}${path}.json`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

const MAP_BOUNDS = { x1: -9215, z1: -4607, x2: 9215, z2: 4607 };
const CHUNK_SIZE = 16;

const FULL_MC_W = MAP_BOUNDS.x2 - MAP_BOUNDS.x1;
const FULL_MC_H = MAP_BOUNDS.z2 - MAP_BOUNDS.z1;

const MAP_CX1 = Math.floor(MAP_BOUNDS.x1 / CHUNK_SIZE);
const MAP_CX2 = Math.floor((MAP_BOUNDS.x2 - 1) / CHUNK_SIZE);
const MAP_CZ1 = Math.floor(MAP_BOUNDS.z1 / CHUNK_SIZE);
const MAP_CZ2 = Math.floor((MAP_BOUNDS.z2 - 1) / CHUNK_SIZE);
const TOTAL_CHUNKS = (MAP_CX2 - MAP_CX1 + 1) * (MAP_CZ2 - MAP_CZ1 + 1);

let mapImgMcX1 = MAP_BOUNDS.x1;
let mapImgMcZ1 = MAP_BOUNDS.z1;
let mapImgMcX2 = MAP_BOUNDS.x2;
let mapImgMcZ2 = MAP_BOUNDS.z2;

let IMG_W = FULL_MC_W;
let IMG_H = FULL_MC_H;

const view = { x: 0, y: 0, scale: 1 };

const BLOCK_COLORS = {
  'minecraft:grass_block':'#5d8a2e','minecraft:dirt':'#8b5e3c','minecraft:stone':'#7a7a7a',
  'minecraft:sand':'#d9c97a','minecraft:gravel':'#8a8880','minecraft:water':'#3c6fa8',
  'minecraft:oak_log':'#6b4c1e','minecraft:oak_planks':'#c8a86a','minecraft:oak_leaves':'#2d6e1a',
  'minecraft:spruce_log':'#4a3218','minecraft:spruce_planks':'#8a6040',
  'minecraft:birch_log':'#d4cfbe','minecraft:birch_planks':'#ddd3a0',
  'minecraft:jungle_log':'#5a3a1a','minecraft:acacia_log':'#6a5040','minecraft:dark_oak_log':'#3a2810',
  'minecraft:cobblestone':'#6e6e6e','minecraft:mossy_cobblestone':'#5e7a5e',
  'minecraft:stone_bricks':'#808080','minecraft:bricks':'#8a4a40','minecraft:glass':'#c8e8f0',
  'minecraft:snow':'#f0f0f0','minecraft:ice':'#90c0e0',
  'minecraft:iron_block':'#d4d4d4','minecraft:gold_block':'#f0c040',
  'minecraft:diamond_block':'#60e8e8','minecraft:emerald_block':'#40c870',
  'minecraft:lapis_block':'#2050a0','minecraft:redstone_block':'#c03020','minecraft:obsidian':'#2a1a3a',
  'minecraft:netherrack':'#8a3030','minecraft:nether_bricks':'#6a2828','minecraft:end_stone':'#d8d890',
  'minecraft:clay':'#909090','minecraft:white_concrete':'#f0f0f0','minecraft:red_concrete':'#c02020',
  'minecraft:blue_concrete':'#2040c0','minecraft:green_concrete':'#206820','minecraft:yellow_concrete':'#d0c020',
  'minecraft:black_concrete':'#181818','minecraft:gray_concrete':'#505050','minecraft:light_gray_concrete':'#909090',
  'minecraft:cyan_concrete':'#209090','minecraft:purple_concrete':'#702090','minecraft:magenta_concrete':'#c040c0',
  'minecraft:orange_concrete':'#d06020','minecraft:brown_concrete':'#603820','minecraft:lime_concrete':'#60c020',
  'minecraft:pink_concrete':'#e09090','minecraft:white_wool':'#e8e8e8','minecraft:red_wool':'#c03030',
  'minecraft:blue_wool':'#2050c0','minecraft:green_wool':'#306830','minecraft:yellow_wool':'#d0c030',
  'minecraft:black_wool':'#202020','minecraft:terracotta':'#985030','minecraft:white_terracotta':'#d0c0b0',
  'minecraft:red_terracotta':'#9a4040','minecraft:barrel':'#7a5a28','minecraft:crafting_table':'#8a5a28',
  'minecraft:furnace':'#606060','minecraft:chest':'#8a6030','minecraft:bookshelf':'#9a7040',
  'minecraft:tnt':'#c04040','minecraft:pumpkin':'#d06820','minecraft:melon_block':'#60a030',
  'minecraft:hay_block':'#c0a020','minecraft:slime':'#60a860','minecraft:honeycomb_block':'#d09020',
};

function blockColor(typeId) {
  if (BLOCK_COLORS[typeId]) return BLOCK_COLORS[typeId];
  let h = 0;
  for (let i = 0; i < typeId.length; i++) h = (h * 31 + typeId.charCodeAt(i)) & 0xffffffff;
  return `#${((h&0xff0000)>>16).toString(16).padStart(2,'0')}${((h&0xff00)>>8).toString(16).padStart(2,'0')}${(h&0xff).toString(16).padStart(2,'0')}`;
}

const countryColors = {};
function getCountryColor(n) {
  if (!countryColors[n]) { const h = hueFromString(n); countryColors[n] = `hsl(${h},60%,45%)`; }
  return countryColors[n];
}
function hueFromString(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h + s.charCodeAt(i) * 7) % 360; return h; }

function getPanelHeight() { return document.getElementById('panel').getBoundingClientRect().height || 0; }

// ─── fitView デバウンス ───────────────────────────────────────────────────────
// 同一フレーム内での多重呼び出しを rAF 1回にまとめる
let _fitViewRaf = null;
function fitView() {
  if (_fitViewRaf) return;
  _fitViewRaf = requestAnimationFrame(() => {
    _fitViewRaf = null;
    _doFitView();
  });
}
function _doFitView() {
  const r = mapArea.getBoundingClientRect();
  const ph = getPanelHeight();
  if (r.width <= 0 || r.height <= 0) return;
  const ah = Math.max(r.height - ph, 100);
  view.scale = Math.min(r.width / FULL_MC_W, ah / FULL_MC_H);
  view.x = (r.width  - FULL_MC_W * view.scale) / 2;
  view.y = (ah - FULL_MC_H * view.scale) / 2;
  applyView();
}

function applyView() {
  const imgMcW = mapImgMcX2 - mapImgMcX1;
  const imgMcH = mapImgMcZ2 - mapImgMcZ1;
  const imgPxW = imgMcW * view.scale;
  const imgPxH = imgMcH * view.scale;
  const imgLeft = view.x + (mapImgMcX1 - MAP_BOUNDS.x1) * view.scale;
  const imgTop  = view.y + (mapImgMcZ1 - MAP_BOUNDS.z1) * view.scale;
  mapImg.style.width  = imgPxW + 'px';
  mapImg.style.height = imgPxH + 'px';
  mapImg.style.left   = imgLeft + 'px';
  mapImg.style.top    = imgTop  + 'px';
  const r = mapArea.getBoundingClientRect();
  chunkCanvas.width  = r.width;
  chunkCanvas.height = r.height;
  _invalidateUnrenderedCache(); // キャンバスサイズ・view変更でキャッシュ無効化
  updateAllMarkers();
  scheduleDrawChunks();
}

function clampView() {
  const r = mapArea.getBoundingClientRect();
  const ph = getPanelHeight();
  const ah = Math.max(r.height - ph, 100);
  const cw = FULL_MC_W * view.scale;
  const ch = FULL_MC_H * view.scale;
  if (cw <= r.width)  view.x = (r.width - cw) / 2;
  else view.x = Math.min(0, Math.max(r.width - cw, view.x));
  if (ch <= ah)  view.y = (ah - ch) / 2;
  else view.y = Math.min(0, Math.max(ah - ch, view.y));
}

function mcToPixel(x, z) {
  return { x: view.x + (x - MAP_BOUNDS.x1) * view.scale, y: view.y + (z - MAP_BOUNDS.z1) * view.scale };
}
function pixelToMc(px, py) {
  return { x: Math.round(MAP_BOUNDS.x1 + (px - view.x) / view.scale), z: Math.round(MAP_BOUNDS.z1 + (py - view.y) / view.scale) };
}
function isInsideMapBounds(x, z) {
  return x >= MAP_BOUNDS.x1 && x <= MAP_BOUNDS.x2 && z >= MAP_BOUNDS.z1 && z <= MAP_BOUNDS.z2;
}

// ══════════════════════════════════════════════════════════════════════════════
// チャンクデータ（Firebase直接）
// ══════════════════════════════════════════════════════════════════════════════
let allChunkData = {};

// 差分検出: 全JSON stringify → 国名+チャンク数のキー比較に変更（大幅に軽量化）
let _lastChunkDataKey = '';
function makeChunkDataKey(data) {
  return Object.keys(data || {}).sort().map(n => n + ':' + (data[n].chunkCount || 0)).join('|');
}

let renderedChunkSet = new Set();

// ─── 未読込オーバーレイ キャッシュ ───────────────────────────────────────────
// renderedChunkSet が変わったときだけ再生成。drawChunks では drawImage 1回で済む。
let _unrenderedCache = null;       // { canvas, scale, tx, ty } | null
let _unrenderedCacheSetSize = -1;  // 前回の renderedChunkSet.size

function _buildUnrenderedCache() {
  const w = chunkCanvas.width, h = chunkCanvas.height;
  if (w === 0 || h === 0) { _unrenderedCache = null; return; }
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const ctx = oc.getContext('2d');

  const visX1 = -view.x / view.scale + MAP_BOUNDS.x1;
  const visZ1 = -view.y / view.scale + MAP_BOUNDS.z1;
  const visX2 = visX1 + w / view.scale;
  const visZ2 = visZ1 + h / view.scale;
  const visCX1 = Math.max(MAP_CX1, Math.floor(visX1 / CHUNK_SIZE) - 1);
  const visCX2 = Math.min(MAP_CX2, Math.ceil(visX2  / CHUNK_SIZE) + 1);
  const visCZ1 = Math.max(MAP_CZ1, Math.floor(visZ1 / CHUNK_SIZE) - 1);
  const visCZ2 = Math.min(MAP_CZ2, Math.ceil(visZ2  / CHUNK_SIZE) + 1);

  ctx.fillStyle   = 'rgba(192,57,43,0.45)';
  ctx.strokeStyle = 'rgba(255,107,91,0.7)';
  ctx.lineWidth   = 1;

  for (let cz = visCZ1; cz <= visCZ2; cz++) {
    for (let cx = visCX1; cx <= visCX2; cx++) {
      if (renderedChunkSet.has(`${cx}_${cz}`)) continue;
      const sx = cx * CHUNK_SIZE, sz = cz * CHUNK_SIZE;
      const p1 = mcToPixel(sx, sz), p2 = mcToPixel(sx + CHUNK_SIZE, sz + CHUNK_SIZE);
      const pw = Math.abs(p2.x - p1.x), ph2 = Math.abs(p2.y - p1.y);
      const px = Math.min(p1.x, p2.x), py = Math.min(p1.y, p2.y);
      ctx.fillRect(px, py, pw, ph2);
      ctx.strokeRect(px, py, pw, ph2);
    }
  }
  _unrenderedCache = { canvas: oc, scale: view.scale, tx: view.x, ty: view.y };
  _unrenderedCacheSetSize = renderedChunkSet.size;
}

function _invalidateUnrenderedCache() {
  _unrenderedCache = null;
  _unrenderedCacheSetSize = -1;
}

async function fetchChunkData() {
  try {
    const data = await fbGet('/chunks');
    const newKey = makeChunkDataKey(data);
    if (newKey === _lastChunkDataKey) return; // 変化なし → 何もしない
    _lastChunkDataKey = newKey;
    allChunkData = data || {};
    renderCountryList();
    scheduleDrawChunks();
  } catch (e) { console.warn('チャンクデータ取得失敗:', e); }
}

let showBorders = true;
let showUnrendered = false;

// ─── drawChunks rAFデバウンス ──────────────────────────────────────────────
// pan/zoom中に毎ピクセル呼ばれるのを 1フレーム 1回に抑える
let _drawChunksRaf = null;
function scheduleDrawChunks() {
  if (_drawChunksRaf) return;
  _drawChunksRaf = requestAnimationFrame(() => { _drawChunksRaf = null; drawChunks(); });
}

function drawChunks() {
  const ctx = chunkCanvas.getContext('2d');
  ctx.clearRect(0, 0, chunkCanvas.width, chunkCanvas.height);

  if (showUnrendered) {
    // view が変わったか、セットが変わったときだけ再生成
    const cacheStale = !_unrenderedCache
      || _unrenderedCacheSetSize !== renderedChunkSet.size
      || _unrenderedCache.scale !== view.scale
      || _unrenderedCache.tx !== view.x
      || _unrenderedCache.ty !== view.y;
    if (cacheStale) _buildUnrenderedCache();
    if (_unrenderedCache) ctx.drawImage(_unrenderedCache.canvas, 0, 0);
    updateUnrenderedStat();
  }

  if (showBorders) {
    for (const n in allChunkData) {
      const d = allChunkData[n];
      if (!d.chunks) continue;
      const c = getCountryColor(n);
      for (const chunk of d.chunks) {
        const sx = chunk.cx * CHUNK_SIZE, sz = chunk.cz * CHUNK_SIZE;
        const ex = sx + CHUNK_SIZE, ez = sz + CHUNK_SIZE;
        const p1 = mcToPixel(sx, sz), p2 = mcToPixel(ex, ez);
        const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
        const px = Math.min(p1.x, p2.x), py = Math.min(p1.y, p2.y);
        ctx.fillStyle = c; ctx.globalAlpha = 0.5; ctx.fillRect(px, py, w, h);
        ctx.strokeStyle = c; ctx.globalAlpha = 0.8; ctx.lineWidth = 2; ctx.strokeRect(px, py, w, h);
      }
    }
  }

  ctx.globalAlpha = 1;
}

function pixelToChunk(px, py) {
  const mc = pixelToMc(px, py);
  return { cx: Math.floor(mc.x / CHUNK_SIZE), cz: Math.floor(mc.z / CHUNK_SIZE) };
}
function getCountryAtPixel(px, py) {
  const c = pixelToChunk(px, py);
  for (const n in allChunkData) {
    const d = allChunkData[n];
    if (!d.chunks) continue;
    const f = d.chunks.find(ch => ch.cx === c.cx && ch.cz === c.cz);
    if (f) return { country: n, count: d.chunkCount };
  }
}
function showCountryPopup(px, py) {
  const info = getCountryAtPixel(px, py);
  if (!info) return;
  popupName.textContent = info.country;
  popupCount.textContent = 'チャンク数: ' + info.count;
  countryPopup.style.display = 'block';
  positionPopup(px, py);
}
function positionPopup(px, py) {
  const cw = chunkCanvas.width;
  let x = px + 12, y = py - 70;
  if (x + 160 > cw) x = px - 172;
  if (x < 4) x = 4;
  if (y < 4) y = py + 20;
  countryPopup.style.left = x + 'px';
  countryPopup.style.top = y + 'px';
}
document.getElementById('popup-close-btn').addEventListener('click', e => {

});

let currentJumpMc = null;
function updateAllMarkers() {
  if (currentJumpMc && jumpMark.style.display !== 'none') {
    const p = mcToPixel(currentJumpMc.x, currentJumpMc.z);
    jumpMark.style.left = p.x + 'px'; jumpMark.style.top = p.y + 'px';
  }
  updateLiveMarkerPositions();
}

let tooltipTimer = null;
function onMapTap(cx, cy) {
  const r = mapArea.getBoundingClientRect();
  const lx = cx - r.left, ly = cy - r.top;
  const mapLeft = view.x, mapTop = view.y;
  const mapRight = view.x + FULL_MC_W * view.scale, mapBottom = view.y + FULL_MC_H * view.scale;
  if (lx < mapLeft || lx > mapRight || ly < mapTop || ly > mapBottom) return;
  tapMark.style.display = 'block'; tapMark.style.left = lx + 'px'; tapMark.style.top = ly + 'px';
  const mc = pixelToMc(lx, ly);
  hdrInfo.textContent = 'X:' + mc.x + ' Z:' + mc.z;
  tooltip.textContent = 'X:' + mc.x + ' Z:' + mc.z; tooltip.style.display = 'block';
  let tx = lx + 12, ty = ly - 30;
  const rr = mapArea.getBoundingClientRect();
  if (tx + 150 > rr.width) tx = lx - 160;
  if (ty < 0) ty = ly + 14;
  tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
  if (tooltipTimer) clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(() => tooltip.style.display = 'none', 2500);
  showCountryPopup(lx, ly);
}

function doJumpTo() {
  const x = parseFloat(document.getElementById('input-jx').value);
  const z = parseFloat(document.getElementById('input-jz').value);
  if (isNaN(x) || isNaN(z)) { showError('X座標とZ座標を数字で入力してください。'); return; }
  currentJumpMc = { x, z };
  zoomToMcCoord(x, z, 4);
  hdrInfo.textContent = 'X:' + x + ' Z:' + z;
  jumpMark.style.display = 'block';
  const p = mcToPixel(x, z);
  jumpMark.style.left = p.x + 'px'; jumpMark.style.top = p.y + 'px';
}

function zoomToMcCoord(x, z, target) {
  const r = mapArea.getBoundingClientRect();
  const ph = getPanelHeight(), ah = Math.max(r.height - ph, 100);
  const min = Math.min(r.width / FULL_MC_W, ah / FULL_MC_H);
  const ns = Math.min(Math.max(target, min), 15);
  view.x = r.width / 2 - (x - MAP_BOUNDS.x1) * ns;
  view.y = ah / 2 - (z - MAP_BOUNDS.z1) * ns;
  view.scale = ns; clampView(); applyView(); setDetailExpanded(false, true);
}

const panelDetail = document.getElementById('panel-detail');
const handleLabel = document.getElementById('handle-label');
const panelHandle = document.getElementById('panel-handle');
let detailExpanded = false;

function detailMaxPx() { return Math.max(100, Math.round(document.getElementById('stage').getBoundingClientRect().height * .58)); }
function setDetailExpanded(exp, skipFitView) {
  detailExpanded = exp;
  if (exp) { panelDetail.style.maxHeight = detailMaxPx() + 'px'; panelDetail.classList.add('expanded'); handleLabel.textContent = '下にスワイプで閉じる'; }
  else { panelDetail.style.maxHeight = '0px'; panelDetail.classList.remove('expanded'); handleLabel.textContent = '上にスワイプで一覧表示'; }
  if (!skipFitView) { fitView(); }
}

let hDragging = false, hMoved = false, hStartY = 0, hStartH = 0, hMaxPx = 0;
function hDragStart(y) {
  const activeTab = document.querySelector('.tab-content.active');
  if (!activeTab || activeTab.id === 'tab-jump' || activeTab.id === 'tab-render') return;
  hDragging = true; hMoved = false; hStartY = y;
  hStartH = panelDetail.getBoundingClientRect().height; hMaxPx = detailMaxPx();
  panelDetail.style.transition = 'none'; panelDetail.classList.add('expanded');
}
function hDragMove(y) {
  if (!hDragging) return;
  const dy = hStartY - y;
  if (Math.abs(dy) > 6) hMoved = true;
  panelDetail.style.maxHeight = Math.min(Math.max(hStartH + dy, 0), hMaxPx) + 'px';
  fitView();
}
function hDragEnd() {
  if (!hDragging) return; hDragging = false; panelDetail.style.transition = '';
  if (!hMoved) { setDetailExpanded(!detailExpanded); return; }
  setDetailExpanded(panelDetail.getBoundingClientRect().height > hMaxPx * .3);
}
panelHandle.addEventListener('touchstart', e => hDragStart(e.touches[0].clientY), { passive: true });
panelHandle.addEventListener('touchmove', e => { if (!hDragging) return; e.preventDefault(); hDragMove(e.touches[0].clientY); }, { passive: false });
panelHandle.addEventListener('touchend', hDragEnd);
panelHandle.addEventListener('touchcancel', hDragEnd);
panelHandle.addEventListener('mousedown', e => {
  hDragStart(e.clientY);
  const mm = e2 => hDragMove(e2.clientY);
  const mu = () => { hDragEnd(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
  window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
});

function switchTab(name) {

// ══════════════════════════════════════════════════════════════════════════════
// タッチ・マウス操作
// ══════════════════════════════════════════════════════════════════════════════
let pointers = {}, panActive = false, panLastX = 0, panLastY = 0;
let pinchActive = false, pinchDist = 0, pinchMidX = 0, pinchMidY = 0;
let isTap = false, tapStartX = 0, tapStartY = 0, tapStartTime = 0;

function onTouchStart(e) {
  if (e.target.closest('#zoom-controls') || e.target.closest('#panel')) return;
  e.preventDefault();
  for (const t of e.changedTouches) pointers[t.identifier] = { x: t.clientX, y: t.clientY };
  const k = Object.keys(pointers);
  if (k.length === 1) {
    const p = pointers[k[0]];
    panActive = true; pinchActive = false;
    panLastX = p.x; panLastY = p.y;
    isTap = true; tapStartX = p.x; tapStartY = p.y; tapStartTime = Date.now();
  } else if (k.length === 2) {
    panActive = false; pinchActive = true; isTap = false;
    const a = pointers[k[0]], b = pointers[k[1]];
    pinchDist = Math.hypot(b.x - a.x, b.y - a.y);
    pinchMidX = (a.x + b.x) / 2; pinchMidY = (a.y + b.y) / 2;
  }
}
function onTouchMove(e) {
  if (e.target.closest('#panel')) return; e.preventDefault();
  for (const t of e.changedTouches) pointers[t.identifier] = { x: t.clientX, y: t.clientY };
  const k = Object.keys(pointers);
  if (k.length === 1 && panActive) {
    const p = pointers[k[0]], dx = p.x - panLastX, dy = p.y - panLastY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isTap = false;
    view.x += dx; view.y += dy; panLastX = p.x; panLastY = p.y; clampView(); applyView();
  } else if (k.length === 2 && pinchActive) {
    const a = pointers[k[0]], b = pointers[k[1]];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = mapArea.getBoundingClientRect();
    const ph = getPanelHeight(), ah = Math.max(r.height - ph, 100);
    const min = Math.min(r.width / FULL_MC_W, ah / FULL_MC_H);
    const ns = Math.min(Math.max(view.scale * dist / pinchDist, min), 15);
    const ox = pinchMidX - r.left, oy = pinchMidY - r.top;
    view.x = ox - (ox - view.x) * (ns / view.scale);
    view.y = oy - (oy - view.y) * (ns / view.scale);
    view.scale = ns;
    view.x += mx - pinchMidX; view.y += my - pinchMidY;
    pinchDist = dist; pinchMidX = mx; pinchMidY = my; clampView(); applyView();
  }
}
function onTouchEnd(e) {
  for (const t of e.changedTouches) delete pointers[t.identifier];
  const rem = Object.keys(pointers).length;
  if (rem === 0) {
    if (isTap && Date.now() - tapStartTime < 300) onMapTap(tapStartX, tapStartY);
    panActive = false; pinchActive = false; isTap = false;
  } else if (rem === 1) {
    pinchActive = false; panActive = true; isTap = false;
    const p = pointers[Object.keys(pointers)[0]]; panLastX = p.x; panLastY = p.y;
  }
}
function onTouchCancel(e) {
  for (const t of e.changedTouches) delete pointers[t.identifier];
  panActive = false; pinchActive = false; isTap = false;
}
chunkCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
chunkCanvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
chunkCanvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
chunkCanvas.addEventListener('touchcancel',onTouchCancel,{ passive: false });

let mouseDragging = false, mouseLastX = 0, mouseLastY = 0, mouseMoved = false;
chunkCanvas.addEventListener('click', e => {
  if (e.target.closest('#zoom-controls') || e.target.closest('#panel')) return;
  if (mouseMoved) { mouseMoved = false; return; }
  const r = mapArea.getBoundingClientRect();
  onMapTap(e.clientX - r.left + r.left, e.clientY - r.top + r.top);
});
chunkCanvas.addEventListener('mousedown', e => {
  if (e.target.closest('#zoom-controls') || e.target.closest('#panel')) return;
  mouseDragging = true; mouseMoved = false; mouseLastX = e.clientX; mouseLastY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!mouseDragging) return;
  const dx = e.clientX - mouseLastX, dy = e.clientY - mouseLastY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) mouseMoved = true;
  view.x += dx; view.y += dy; mouseLastX = e.clientX; mouseLastY = e.clientY; clampView(); applyView();
});
window.addEventListener('mouseup', () => mouseDragging = false);
chunkCanvas.addEventListener('wheel', e => {
  e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

function zoomAt(cx, cy, f) {
  const r = mapArea.getBoundingClientRect();
  const ph = getPanelHeight(), ah = Math.max(r.height - ph, 100);
  const min = Math.min(r.width / FULL_MC_W, ah / FULL_MC_H);
  const ns = Math.min(Math.max(view.scale * f, min), 15);
  const ox = cx - r.left, oy = cy - r.top;
  view.x = ox - (ox - view.x) * (ns / view.scale);
  view.y = oy - (oy - view.y) * (ns / view.scale);
  view.scale = ns; clampView(); applyView();
}
function zoomBy(f) {
  const r = mapArea.getBoundingClientRect();
  const ph = getPanelHeight(), ah = Math.max(r.height - ph, 100);
  zoomAt(r.left + r.width / 2, r.top + ah / 2, f);
}
function bindZoomBtn(el, f) {
  let fired = false;
  const trigger = e => { e.preventDefault(); e.stopPropagation(); if (fired) return; fired = true; zoomBy(f); setTimeout(() => fired = false, 150); };
  el.addEventListener('touchstart', trigger, { passive: false });
  el.addEventListener('mousedown', trigger);
  el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
}
bindZoomBtn(document.getElementById('zoom-in'),  1.4);
bindZoomBtn(document.getElementById('zoom-out'), 1 / 1.4);
document.getElementById('btn-jump').addEventListener('click', doJumpTo);

// ══════════════════════════════════════════════════════════════════════════════
// ライブプレイヤー（Firebase直接）
// ══════════════════════════════════════════════════════════════════════════════
let liveActive = false, liveMarkers = {}, liveTimer = null;
const liveToggleBtn    = document.getElementById('btn-live-toggle');
const liveStatusChip   = document.getElementById('live-status');
const liveCountChip    = document.getElementById('live-count');
const livePlayerListEl = document.getElementById('live-player-list');

function upsertLiveMarker(id, x, z) {
  let e = liveMarkers[id];
  if (!e) {
    const el = document.createElement('div'); el.className = 'player-mark live-mark';
    const lb = document.createElement('div'); lb.className = 'label'; lb.textContent = id;
    const ic = document.createElement('div'); ic.className = 'icon';
    ic.style.background = `hsl(${hueFromString(id)},55%,40%)`; ic.textContent = id.charAt(0).toUpperCase();
    const ai = new Image(); ai.alt = id;
    ai.onload = () => { ic.textContent = ''; ic.appendChild(ai); };
    ai.src = 'https://crafatar.com/avatars/' + encodeURIComponent(id) + '?size=32&overlay';
    el.append(lb, ic); mapArea.appendChild(el);
    e = { el }; liveMarkers[id] = e;
  }
  e.x = x; e.z = z;
  const p = mcToPixel(x, z);
  e.el.style.left = p.x + 'px'; e.el.style.top = p.y + 'px';
}
function removeLiveMarker(id) { const e = liveMarkers[id]; if (!e) return; e.el.remove(); delete liveMarkers[id]; }
function clearAllLiveMarkers() { Object.keys(liveMarkers).forEach(removeLiveMarker); }
function updateLiveMarkerPositions() {
  Object.values(liveMarkers).forEach(e => { const p = mcToPixel(e.x, e.z); e.el.style.left = p.x + 'px'; e.el.style.top = p.y + 'px'; });
}

function buildPlayerListItem(id, p) {
  const item = document.createElement('div'); item.className = 'live-list-item';
  const av = document.createElement('div'); av.className = 'avatar';
  av.style.background = `hsl(${hueFromString(id)},55%,40%)`; av.textContent = id.charAt(0).toUpperCase();
  const ai = new Image(); ai.alt = id;
  ai.onload = () => { av.textContent = ''; av.appendChild(ai); };
  ai.src = 'https://crafatar.com/avatars/' + encodeURIComponent(id) + '?size=28&overlay';
  const info = document.createElement('div'); info.className = 'info';
  const ne = document.createElement('div'); ne.className = 'mcid'; ne.textContent = id;
  const co = document.createElement('div'); co.className = 'coords'; co.textContent = `X: ${Math.round(p.x)}  Z: ${Math.round(p.z)}`;
  info.append(ne, co); item.append(av, info);
  item.addEventListener('click', () => zoomToMcCoord(p.x, p.z, 6));
  return item;
}
function renderLivePlayerList(data) {
  livePlayerListEl.innerHTML = '';
  const ids = Object.keys(data || {}).filter(id => data[id] && typeof data[id].x === 'number' && typeof data[id].z === 'number' && isInsideMapBounds(data[id].x, data[id].z)).sort();
  if (!ids.length) {
    const e = document.createElement('div'); e.className = 'live-list-empty'; e.textContent = 'オンラインのプレイヤーがいません'; livePlayerListEl.appendChild(e);
  } else { ids.forEach(id => livePlayerListEl.appendChild(buildPlayerListItem(id, data[id]))); }
}
async function refreshLive() {
  try {
    const data = await fbGet('/players');
    const seen = {};
    Object.keys(data || {}).forEach(id => {
      const p = data[id];
      if (!p || typeof p.x !== 'number' || typeof p.z !== 'number') return;
      seen[id] = true;
      if (isInsideMapBounds(p.x, p.z)) upsertLiveMarker(id, p.x, p.z);
      else removeLiveMarker(id);
    });
    Object.keys(liveMarkers).forEach(id => { if (!seen[id]) removeLiveMarker(id); });
    renderLivePlayerList(data || {});
    liveStatusChip.textContent = '接続中';
    liveCountChip.textContent = 'プレイヤー: ' + Object.keys(seen).length + '人';
  } catch (e) { liveStatusChip.textContent = '接続エラー'; showError('プレイヤー情報の取得に失敗: ' + e.message); }
}
function startLive() { if (liveTimer) clearInterval(liveTimer); liveStatusChip.textContent = '接続中...'; refreshLive(); liveTimer = setInterval(refreshLive, 2000); }
function stopLive() { if (liveTimer) clearInterval(liveTimer); liveTimer = null; clearAllLiveMarkers(); livePlayerListEl.innerHTML = ''; liveStatusChip.textContent = '未接続'; liveCountChip.textContent = 'プレイヤー: 0人'; }
liveToggleBtn.addEventListener('click', () => {
  liveActive = !liveActive;
  if (liveActive) { liveToggleBtn.textContent = 'ライブ表示: ON'; liveToggleBtn.classList.add('danger'); startLive(); }
  else { liveToggleBtn.textContent = 'ライブ表示: OFF'; liveToggleBtn.classList.remove('danger'); stopLive(); }
});
document.getElementById('tab-btn-players').addEventListener('click', () => {
  if (!liveActive) { liveActive = true; liveToggleBtn.textContent = 'ライブ表示: ON'; liveToggleBtn.classList.add('danger'); startLive(); }
});

// ══════════════════════════════════════════════════════════════════════════════
// 描画タブ（手動）— Firebase直接
// ══════════════════════════════════════════════════════════════════════════════
const renderCanvas   = document.getElementById('render-canvas');
const renderWrap     = document.getElementById('render-canvas-wrap');
const renderStat     = document.getElementById('render-stat');
const renderProgress = document.getElementById('render-progress-bar');
const btnRenderLoad  = document.getElementById('btn-render-load');
const btnRenderSave  = document.getElementById('btn-render-save');
let renderImageDataURL = null;

function isWaterChunk(val) {
  if (!val) return true;
  const id = val.id || '';
  return id === 'minecraft:water' || id === 'minecraft:kelp' ||
    id === 'minecraft:seagrass' || id === 'minecraft:tall_seagrass' ||
    id === 'minecraft:bubble_column';
}

function updateRenderedChunkSet(rawData) {
  renderedChunkSet = new Set();
  for (const key of Object.keys(rawData || {})) {
    const u = key.lastIndexOf('_'); if (u === -1) continue;
    const bx = parseInt(key.slice(0, u)), bz = parseInt(key.slice(u + 1));
    if (isNaN(bx) || isNaN(bz)) continue;
    const cx = Math.floor(bx / CHUNK_SIZE), cz = Math.floor(bz / CHUNK_SIZE);
    renderedChunkSet.add(`${cx}_${cz}`);
  }
  _invalidateUnrenderedCache(); // データ更新時はキャッシュ破棄
  if (showUnrendered) { updateUnrenderedStat(); scheduleDrawChunks(); }
}

async function loadAndRender() {
  btnRenderLoad.disabled = true; btnRenderSave.disabled = true;
  renderStat.textContent = 'データ取得中...'; renderProgress.style.width = '0%';
  renderImageDataURL = null;
  let meta, rawData;
  try {
    const res = await fbGet('/blocks');
    meta    = res?.meta || {};
    rawData = res?.data || {};
  } catch (e) {
    renderStat.textContent = '取得失敗: ' + e.message;
    btnRenderLoad.disabled = false; return;
  }
  updateRenderedChunkSet(rawData);

  const entries = Object.entries(rawData);
  if (!entries.length) {
    renderStat.textContent = 'データなし。マイクラで /earth:rendering を実行してください。';
    btnRenderLoad.disabled = false; return;
  }
  renderStat.textContent = `描画中... (${entries.length}ブロック)`;
  const chunkMap = new Map();
  for (const [key, val] of entries) {
    const u = key.lastIndexOf('_'); if (u === -1) continue;
    const bx = parseInt(key.slice(0, u)), bz = parseInt(key.slice(u + 1));
    if (isNaN(bx) || isNaN(bz)) continue;
    chunkMap.set(`${Math.floor(bx / CHUNK_SIZE)}_${Math.floor(bz / CHUNK_SIZE)}`, val);
  }
  let minCX = Infinity, maxCX = -Infinity, minCZ = Infinity, maxCZ = -Infinity;
  for (const ck of chunkMap.keys()) {
    const u = ck.indexOf('_');
    const cx = parseInt(ck.slice(0, u)), cz = parseInt(ck.slice(u + 1));
    minCX = Math.min(minCX, cx); maxCX = Math.max(maxCX, cx);
    minCZ = Math.min(minCZ, cz); maxCZ = Math.max(maxCZ, cz);
  }
  const numCX = maxCX - minCX + 1, numCZ = maxCZ - minCZ + 1;
  const chunkPx = Math.max(1, Math.floor(Math.min(2048 / numCX, 2048 / numCZ)));
  renderCanvas.width = numCX * chunkPx; renderCanvas.height = numCZ * chunkPx;
  const ctx = renderCanvas.getContext('2d');
  ctx.fillStyle = '#3c6fa8'; ctx.fillRect(0, 0, renderCanvas.width, renderCanvas.height);
  const imageData = ctx.getImageData(0, 0, renderCanvas.width, renderCanvas.height);
  const d = imageData.data;
  const chunkEntries = [...chunkMap.entries()];
  const BATCH = 500;
  for (let i = 0; i < chunkEntries.length; i += BATCH) {
    const end = Math.min(i + BATCH, chunkEntries.length);
    for (let j = i; j < end; j++) {
      const [ck, val] = chunkEntries[j];
      const u = ck.indexOf('_');
      const cx = parseInt(ck.slice(0, u)), cz = parseInt(ck.slice(u + 1));
      const px0 = (cx - minCX) * chunkPx, pz0 = (cz - minCZ) * chunkPx;
      let r, g, b;
      if (isWaterChunk(val)) { r = 0x3c; g = 0x6f; b = 0xa8; }
      else {
        const y = val.y ?? 64, bright = Math.min(1, Math.max(0.5, (y + 64) / 320));
        const hex = (blockColor(val.id || 'minecraft:stone')).slice(1);
        r = Math.min(255, Math.round(parseInt(hex.slice(0,2),16) * bright));
        g = Math.min(255, Math.round(parseInt(hex.slice(2,4),16) * bright));
        b = Math.min(255, Math.round(parseInt(hex.slice(4,6),16) * bright));
      }
      for (let dy = 0; dy < chunkPx; dy++) for (let dx = 0; dx < chunkPx; dx++) {
        const pi = ((pz0 + dy) * renderCanvas.width + (px0 + dx)) * 4;
        d[pi] = r; d[pi+1] = g; d[pi+2] = b; d[pi+3] = 255;
      }
    }
    renderProgress.style.width = Math.floor((end / chunkEntries.length) * 100) + '%';
    renderStat.textContent = `描画中... ${end}/${chunkEntries.length}チャンク`;
    await new Promise(r => setTimeout(r, 0));
  }
  ctx.putImageData(imageData, 0, 0);
  renderProgress.style.width = '100%';
  renderStat.textContent = `完了 — ${chunkEntries.length}チャンク`;
  renderImageDataURL = renderCanvas.toDataURL('image/png');
  btnRenderSave.disabled = false; btnRenderLoad.disabled = false;
}
function saveRenderAsPng() {
  if (!renderImageDataURL) return;
  const now = new Date();
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const link = document.createElement('a'); link.download = `menearth_map_${ts}.png`; link.href = renderImageDataURL; link.click();
}
btnRenderLoad.addEventListener('click', loadAndRender);
btnRenderSave.addEventListener('click', saveRenderAsPng);

// ══════════════════════════════════════════════════════════════════════════════
// 自動マップ描画（Firebase直接）
// ══════════════════════════════════════════════════════════════════════════════
let lastAutoScanned = 0;
const _autoOffscreen = document.createElement('canvas');

// ─── autoLoad キャッシュキー ──────────────────────────────────────────────────
// チャンク数 + lastScanned の組み合わせで変化を検出。
// 同じキーなら toDataURL() を含む描画処理全体をスキップする。
let _lastAutoRenderKey = '';

function makeAutoRenderKey(chunkMap, meta) {
  return `${chunkMap.size}_${meta.lastScanned || ''}`;
}

async function autoLoadBlockMap() {
  try {
    const res = await fbGet('/blocks');
    const meta    = res?.meta || {};
    const rawData = res?.data || {};
    const blockCount = Object.keys(rawData).length;

    if (blockCount === 0) {
      hdrInfo.textContent = 'ブロックデータ未生成 — マイクラで /earth:rendering を実行してください';
      return;
    }

    updateRenderedChunkSet(rawData);

    const chunkMap = new Map();
    let minCX = Infinity, maxCX = -Infinity, minCZ = Infinity, maxCZ = -Infinity;

    for (const [key, val] of Object.entries(rawData)) {
      const u = key.lastIndexOf('_'); if (u === -1) continue;
      const bx = parseInt(key.slice(0, u)), bz = parseInt(key.slice(u + 1));
      if (isNaN(bx) || isNaN(bz)) continue;
      const cx = Math.floor(bx / CHUNK_SIZE), cz = Math.floor(bz / CHUNK_SIZE);
      if (cx < MAP_CX1 || cx > MAP_CX2 || cz < MAP_CZ1 || cz > MAP_CZ2) continue;
      chunkMap.set(`${cx}_${cz}`, val);
      minCX = Math.min(minCX, cx); maxCX = Math.max(maxCX, cx);
      minCZ = Math.min(minCZ, cz); maxCZ = Math.max(maxCZ, cz);
    }

    if (minCX === Infinity) { hdrInfo.textContent = 'マップ範囲内のブロックデータがありません'; return; }

    // ─── キャッシュチェック: チャンク数もタイムスタンプも変わっていなければ描画スキップ ───
    const renderKey = makeAutoRenderKey(chunkMap, meta);
    if (renderKey === _lastAutoRenderKey) {
      // スキャン中だけステータスを更新して終了
      if (meta.scanning) {
        hdrInfo.textContent = `スキャン進行中: 収集中 (${blockCount.toLocaleString()}ブロック取得済み)`;
      }
      return;
    }
    _lastAutoRenderKey = renderKey;

    hdrInfo.textContent = meta.scanning
      ? `スキャン進行中: 収集中 (${blockCount.toLocaleString()}ブロック取得済み)`
      : 'マップ描画中...';

    const numCX = maxCX - minCX + 1, numCZ = maxCZ - minCZ + 1;
    const chunkPx = Math.max(1, Math.floor(Math.min(2048 / numCX, 2048 / numCZ)));
    const cw = numCX * chunkPx, ch = numCZ * chunkPx;
    _autoOffscreen.width = cw; _autoOffscreen.height = ch;
    const ctx = _autoOffscreen.getContext('2d');
    ctx.fillStyle = '#3c6fa8'; ctx.fillRect(0, 0, cw, ch);
    const imageData = ctx.getImageData(0, 0, cw, ch);
    const d = imageData.data;

    for (const [ck, val] of chunkMap) {
      const u = ck.indexOf('_');
      const cx = parseInt(ck.slice(0, u)), cz = parseInt(ck.slice(u + 1));
      const px0 = (cx - minCX) * chunkPx, pz0 = (cz - minCZ) * chunkPx;
      let r, g, b;
      if (isWaterChunk(val)) { r = 0x3c; g = 0x6f; b = 0xa8; }
      else {
        const y = val?.y ?? 64, bright = Math.min(1.1, Math.max(0.55, (y + 64) / 290));
        const hex = (blockColor(val?.id || 'minecraft:stone')).slice(1);
        r = Math.min(255, Math.round(parseInt(hex.slice(0,2),16) * bright));
        g = Math.min(255, Math.round(parseInt(hex.slice(2,4),16) * bright));
        b = Math.min(255, Math.round(parseInt(hex.slice(4,6),16) * bright));
      }
      for (let dy = 0; dy < chunkPx; dy++) for (let dx = 0; dx < chunkPx; dx++) {
        const pi = ((pz0 + dy) * cw + (px0 + dx)) * 4;
        d[pi] = r; d[pi+1] = g; d[pi+2] = b; d[pi+3] = 255;
      }
    }

    ctx.putImageData(imageData, 0, 0);
    mapImgMcX1 = minCX * CHUNK_SIZE; mapImgMcZ1 = minCZ * CHUNK_SIZE;
    mapImgMcX2 = (maxCX + 1) * CHUNK_SIZE; mapImgMcZ2 = (maxCZ + 1) * CHUNK_SIZE;
    IMG_W = cw; IMG_H = ch;

    const dataUrl = _autoOffscreen.toDataURL('image/png');
    renderImageDataURL = dataUrl; btnRenderSave.disabled = false;
    mapImg.onload = () => { fitView(); scheduleDrawChunks(); };
    mapImg.src = dataUrl;

    if (meta.lastScanned) {
      const dt = new Date(meta.lastScanned).toLocaleString('ja-JP');
      hdrInfo.textContent = `最終更新: ${dt}  (${chunkMap.size.toLocaleString()}チャンク)`;
    } else {
      hdrInfo.textContent = `スキャン中 (${chunkMap.size.toLocaleString()}チャンク)`;
    }
    renderStat.textContent = `自動描画済み — ${chunkMap.size.toLocaleString()}チャンク (${cw}×${ch}px)`;

  } catch (e) {
    hdrInfo.textContent = 'ブロックデータ取得失敗: ' + e.message;
    console.error('autoLoadBlockMap error:', e);
  }
}

// ─── resize デバウンス ────────────────────────────────────────────────────────
// ウィンドウリサイズ時に fitView を連打しない
let _resizeTimer = null;
window.addEventListener('resize', () => {
  if (_resizeTimer) clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { _resizeTimer = null; fitView(); }, 100);
});

window.addEventListener('load', () => {
  fitView();
  fetchChunkData(); setInterval(fetchChunkData, 10000);
  document.getElementById('live-player-list').style.display = 'flex';
  document.getElementById('country-list-wrap').style.display = 'none';
  document.getElementById('render-canvas-wrap').style.display = 'none';
  let _autoLoadTimer = null;
  async function scheduleAutoLoad() {
    await autoLoadBlockMap();
    const scanning = hdrInfo.textContent.includes('スキャン進行中');
    _autoLoadTimer = setTimeout(scheduleAutoLoad, scanning ? 10000 : 60000);
  }
  scheduleAutoLoad();
});
</script>
