<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>麺Earth MAP</title>

<!-- Leaflet.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700;900&display=swap');
:root {
  --grass:#6fae3e; --grass-dark:#4f7f2c; --dirt-dark:#5c4a33; --stone:#8a8a8a;
  --stone-dark:#545454; --obsidian:#0d0f0d; --panel-bg:#1a1d16; --panel-border:#3a3f2e;
  --gold:#f0c419; --gold-dark:#b8941a; --diamond:#4fd1e8; --redstone:#c0392b;
  --redstone-dark:#7a1f16; --emerald:#2ecc71; --text-main:#e8e6d8; --text-dim:#8a9478;
  --font-pixel:'Press Start 2P',monospace; --font-body:'Noto Sans JP',sans-serif
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--obsidian); color: var(--text-main); font-family: var(--font-body) }
body { display: flex; flex-direction: column }

/* ── ヘッダー ── */
#header {
  flex: 0 0 auto;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.15)), var(--dirt-dark);
  border-bottom: 4px solid var(--gold-dark);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  z-index: 1000;
}
#header .logo { font-family: var(--font-pixel); font-size: 14px; color: var(--gold); text-shadow: 2px 2px 0 #000; white-space: nowrap }
#header .logo:before { content: '\26cf\fe0e ' }
#hdr-info { flex: 1; background: rgba(0,0,0,.45); border: 2px solid var(--panel-border); border-radius: 3px; padding: 6px 10px; font-size: 12px; color: var(--emerald); text-align: center; font-family: monospace; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* ── エラー ── */
.error { display: none; font-family: var(--font-pixel); font-size: 11px; color: #fff; padding: 10px 14px; text-align: center; flex: 0 0 auto; text-shadow: 1px 1px 0 #000; background: #c0392b; z-index: 1000 }
.error.show { display: block }

/* ── ステージ（マップ + パネル） ── */
#stage { flex: 1; position: relative; overflow: hidden; min-height: 0 }

/* ── Leafletマップ ── */
#map { position: absolute; inset: 0; background: #060a12; z-index: 0 }

/* Leafletのデフォルトアニメーションをpixelatedに */
.leaflet-tile { image-rendering: pixelated }

/* ── タイルロード中オーバーレイ ── */
#tile-loading {
  position: absolute; inset: 0; background: rgba(6,10,18,.9);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 500; gap: 16px;
}
#tile-loading.hidden { display: none }
#tile-loading .loading-logo { font-family: var(--font-pixel); font-size: 16px; color: var(--gold); text-shadow: 2px 2px 0 #000 }
#tile-loading-bar-wrap { width: 260px; height: 14px; background: var(--stone-dark); border: 2px solid var(--panel-border); border-radius: 2px; overflow: hidden }
#tile-loading-bar { height: 100%; background: var(--grass); width: 0%; transition: width .2s }
#tile-loading-text { font-family: monospace; font-size: 12px; color: var(--text-dim) }

/* ── パネル ── */
#panel {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 400;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.1)), var(--panel-bg);
  border-top: 4px solid var(--panel-border);
  border-radius: 14px 14px 0 0;
  box-shadow: 0 -8px 24px rgba(0,0,0,.5);
  display: flex; flex-direction: column; max-height: 88%;
}
#panel-handle { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 12px 4px; cursor: grab; touch-action: none; user-select: none }
.handle-bar { width: 46px; height: 5px; border-radius: 3px; background: var(--panel-border) }
.handle-label { font-family: var(--font-pixel); font-size: 7px; color: var(--text-dim); min-height: 9px }

/* ── タブ ── */
.tabs { display: flex; gap: 6px; padding: 0 12px; margin: 4px 0 8px; flex: 0 0 auto; flex-wrap: wrap }
.tab-btn {
  flex: 1; min-width: 60px; font-family: var(--font-pixel); font-size: 10px; padding: 10px 4px;
  color: #cfd6c4; background: var(--stone-dark);
  border-top: 3px solid #6e6e6e; border-left: 3px solid #6e6e6e;
  border-right: 3px solid #2c2c2c; border-bottom: 5px solid #2c2c2c;
  border-radius: 2px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer
}
.tab-btn.active {
  color: #fff; background: var(--grass);
  border-top-color: #9ed46e; border-left-color: #9ed46e;
  border-right-color: var(--grass-dark); border-bottom-color: var(--grass-dark);
  box-shadow: 0 0 14px rgba(111,174,62,.55); transform: translateY(-1px)
}
.tab-content { display: none; flex-direction: column; gap: 8px; padding: 0 12px 8px; flex: 0 0 auto }
.tab-content.active { display: flex }

/* ── フォーム部品 ── */
.field-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end }
.field-group { display: flex; flex-direction: column; gap: 4px }
.field-label { font-family: var(--font-pixel); font-size: 8px; color: var(--gold) }
input[type=number] { background: #0a0d08; border: 2px solid var(--panel-border); color: var(--text-main); font-size: 15px; padding: 8px 10px; border-radius: 2px; width: 100px }
.action-btn {
  font-family: var(--font-pixel); font-size: 10px; color: #fff; padding: 10px 14px;
  text-shadow: 1px 1px 0 #000; cursor: pointer;
  background: var(--grass);
  border-top: 3px solid #9ed46e; border-left: 3px solid #9ed46e;
  border-right: 3px solid var(--grass-dark); border-bottom: 3px solid var(--grass-dark)
}
.action-btn:active { border-top-color: var(--grass-dark); border-left-color: var(--grass-dark); border-right-color: #9ed46e; border-bottom-color: #9ed46e }
.action-btn.danger { background: var(--redstone); border-top-color: #e0685a; border-left-color: #e0685a; border-right-color: var(--redstone-dark); border-bottom-color: var(--redstone-dark) }
.action-btn.jump { background: #2a7f92; border-top-color: var(--diamond); border-left-color: var(--diamond); border-right-color: #1a4f5c; border-bottom-color: #1a4f5c }
.action-btn:disabled { opacity: .45; cursor: not-allowed }
.info-chip { font-size: 12px; background: rgba(0,0,0,.4); border: 2px solid var(--panel-border); color: var(--text-dim); padding: 6px 10px; border-radius: 3px }

/* ── パネル詳細 ── */
#panel-detail { flex: 0 0 auto; overflow: hidden; max-height: 0; transition: max-height .32s cubic-bezier(.2,.8,.2,1) }
#panel-detail.expanded { overflow-y: auto; -webkit-overflow-scrolling: touch }
#live-player-list { display: flex; flex-direction: column; gap: 6px; padding: 4px 12px 12px }
.live-list-item { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.35); border: 2px solid var(--panel-border); border-radius: 4px; padding: 6px 10px; cursor: pointer }
.avatar { width: 28px; height: 28px; border-radius: 3px; border: 2px solid var(--emerald); flex-shrink: 0; background: #222; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 13px; overflow: hidden }
.avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated }
.info { display: flex; flex-direction: column; gap: 1px; min-width: 0 }
.mcid { font-size: 13px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.coords { font-size: 11px; color: var(--text-dim) }
.live-list-empty { font-size: 12px; color: var(--text-dim); text-align: center; padding: 14px 0 }
#country-list-wrap { display: flex; flex-direction: column; gap: 6px; padding: 4px 12px 12px }
.country-list-item { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.35); border: 2px solid var(--panel-border); border-radius: 4px; padding: 8px 10px; cursor: pointer }
.country-color-block { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,.2) }
.country-item-name { flex: 1; font-size: 13px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.country-item-count { font-size: 11px; color: var(--text-dim); white-space: nowrap }

/* ── プレイヤーマーカー ── */
.player-mark { display: flex; flex-direction: column; align-items: center; pointer-events: none }
.player-mark .label { font-family: var(--font-pixel); font-size: 8px; color: #fff; background: rgba(0,0,0,.75); padding: 3px 6px; border-radius: 2px; margin-bottom: 4px; white-space: nowrap; border: 1px solid var(--gold-dark) }
.player-mark .icon { width: 32px; height: 32px; border: 3px solid var(--gold); border-radius: 3px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 16px; position: relative; overflow: hidden; box-shadow: 0 0 10px rgba(240,196,25,.5), 0 3px 6px rgba(0,0,0,.5) }
.player-mark .icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; pointer-events: none }
.live-mark .icon { border-color: var(--emerald); box-shadow: 0 0 10px rgba(46,204,113,.7) }
.live-mark .icon:after { content: ''; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); animation: liveBlink 1.2s ease-in-out infinite }
@keyframes liveBlink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── タイル更新通知 ── */
#update-toast {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(10,14,10,.95); border: 2px solid var(--emerald);
  color: var(--emerald); font-family: var(--font-pixel); font-size: 9px;
  padding: 8px 14px; border-radius: 3px; z-index: 450; display: none; white-space: nowrap;
}
#update-toast.show { display: block; animation: toastIn .3s ease }
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(-8px) } to { opacity:1; transform: translateX(-50%) translateY(0) } }
</style>
</head>
<body>

<div id="header">
  <div class="logo">麺Earth</div>
  <div id="hdr-info">マップ読み込み中...</div>
</div>
<div id="error-banner" class="error"></div>

<div id="stage">
  <!-- Leafletマップ -->
  <div id="map"></div>

  <!-- タイルロード中オーバーレイ -->
  <div id="tile-loading">
    <div class="loading-logo">⛏ 麺Earth MAP</div>
    <div id="tile-loading-bar-wrap"><div id="tile-loading-bar"></div></div>
    <div id="tile-loading-text">タイルデータを取得中...</div>
  </div>

  <!-- 更新通知トースト -->
  <div id="update-toast">🗺 マップが更新されました</div>

  <!-- パネル -->
  <div id="panel">
    <div id="panel-handle">
      <div class="handle-bar"></div>
      <div class="handle-label" id="handle-label">上にスワイプで一覧表示</div>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="live" id="tab-btn-players">&#128100; プレイヤー</button>
      <button type="button" class="tab-btn" data-tab="countries" id="tab-btn-countries">&#127757; 国一覧</button>
      <button type="button" class="tab-btn" data-tab="jump" id="tab-btn-jump">&#127919; ジャンプ</button>
    </div>

    <!-- プレイヤータブ -->
    <div class="tab-content active" id="tab-live">
      <div class="field-row">
        <button type="button" class="action-btn" id="btn-live-toggle">ライブ表示: OFF</button>
        <div class="info-chip" id="live-status">未接続</div>
      </div>
      <div class="field-row">
        <div class="info-chip" id="live-count">プレイヤー: 0人</div>
      </div>
    </div>

    <!-- 国一覧タブ -->
    <div class="tab-content" id="tab-countries">
      <div class="info-chip" id="countries-count">読み込み中...</div>
    </div>

    <!-- ジャンプタブ -->
    <div class="tab-content" id="tab-jump">
      <div class="field-row">
        <div class="field-group"><div class="field-label">MC X</div><input type="number" id="input-jx" placeholder="0"></div>
        <div class="field-group"><div class="field-label">MC Z</div><input type="number" id="input-jz" placeholder="0"></div>
        <button type="button" class="action-btn jump" id="btn-jump">ジャンプ</button>
      </div>
    </div>

    <div id="panel-detail">
      <div id="live-player-list"></div>
      <div id="country-list-wrap" style="display:none"></div>
    </div>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════════════════
// 設定
// ══════════════════════════════════════════════════════════════════════════════
const WORKER_API = 'https://map.hp7vvyvc25.workers.dev';
const MAP_BOUNDS = { x1: -9215, z1: -4607, x2: 9215, z2: 4607 };
const TILE_SIZE  = 256; // firebase_sync.js と合わせること
const CHUNK_SIZE = 16;

// ══════════════════════════════════════════════════════════════════════════════
// Leaflet カスタム CRS（Minecraft座標系をそのまま使う）
// ══════════════════════════════════════════════════════════════════════════════
const MC_W = MAP_BOUNDS.x2 - MAP_BOUNDS.x1; // 18430
const MC_H = MAP_BOUNDS.z2 - MAP_BOUNDS.z1; // 9214

// Leafletのシンプル座標系（ピクセル直接指定）を使う
const mcCRS = L.extend({}, L.CRS.Simple, {
  // MC座標 → Leafletのlatlng（lngがX、latが-Z）
  // Leafletは lat=Y(上がプラス) なので Z は反転する
});

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -4,
  maxZoom:  4,
  zoomSnap: 0.5,
  zoomDelta: 0.5,
  attributionControl: false,
  zoomControl: false,
});

// ズームコントロールを右上に
L.control.zoom({ position: 'bottomright' }).addTo(map);

// MC座標 → Leaflet LatLng変換
function mcToLatLng(x, z) {
  // Leaflet CRS.Simple: lat = -z, lng = x（上がマイナスZ）
  return L.latLng(-z, x);
}
function latLngToMc(latlng) {
  return { x: Math.round(latlng.lng), z: Math.round(-latlng.lat) };
}

// マップ境界をLeaflet座標で設定
const bounds = L.latLngBounds(
  mcToLatLng(MAP_BOUNDS.x1, MAP_BOUNDS.z2), // 南西（Z最大）
  mcToLatLng(MAP_BOUNDS.x2, MAP_BOUNDS.z1)  // 北東（Z最小）
);
map.setMaxBounds(bounds.pad(0.1));
map.fitBounds(bounds);

// ── 座標表示 ──────────────────────────────────────────────────────────────────
map.on('mousemove', e => {
  const mc = latLngToMc(e.latlng);
  document.getElementById('hdr-info').textContent = `X: ${mc.x}  Z: ${mc.z}`;
});
map.on('click', e => {
  const mc = latLngToMc(e.latlng);
  document.getElementById('hdr-info').textContent = `X: ${mc.x}  Z: ${mc.z}`;
});

// ══════════════════════════════════════════════════════════════════════════════
// タイルレイヤー
// ══════════════════════════════════════════════════════════════════════════════
let tileLayer    = null;
let tilesMeta    = null;
let tilesIndex   = null;
let lastRendered = 0;

class McTileLayer extends L.GridLayer {
  createTile(coords, done) {
    const img = document.createElement('img');
    img.style.imageRendering = 'pixelated';

    if (!tilesIndex || !tilesMeta) {
      // まだデータ未取得 → 海色
      img.src = 'data:image/gif;base64,R0lGODlhAQABAPAAADxvsAAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
      done(null, img);
      return img;
    }

    // Leafletのzoom座標 → タイルインデックス変換
    // zoom=0のとき全マップが1タイル相当
    const z = coords.z; // Leaflet zoom
    const scale = Math.pow(2, z);

    // zoom=0のとき全マップを1枚として扱う基準タイルサイズ
    // MCブロック数 / タイルサイズ = タイル枚数
    const tilesX = tilesMeta.tilesX;
    const tilesZ = tilesMeta.tilesZ;

    // Leaflet coords.x/y → タイルグリッドのtx/tz
    const tx = coords.x;
    const tz = coords.y; // Leaflet y は南が増える（Z方向と一致）

    if (tx < 0 || tz < 0 || tx >= tilesX || tz >= tilesZ) {
      // 範囲外 → 透明
      img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
      done(null, img);
      return img;
    }

    const key = `${tx}_${tz}`;
    const url = tilesIndex[key];

    if (!url || url === 'empty') {
      // 空タイル → 海色のデータURL
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3c6fa8';
      ctx.fillRect(0, 0, 256, 256);
      img.src = canvas.toDataURL();
      done(null, img);
      return img;
    }

    img.onload  = () => done(null, img);
    img.onerror = () => {
      // エラー時も海色で埋める
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3c6fa8';
      ctx.fillRect(0, 0, 256, 256);
      img.src = canvas.toDataURL();
      done(null, img);
    };
    img.src = url;
    img.crossOrigin = 'anonymous';
    return img;
  }
}

async function loadTileMap() {
  const loadingEl  = document.getElementById('tile-loading');
  const loadingBar = document.getElementById('tile-loading-bar');
  const loadingTxt = document.getElementById('tile-loading-text');

  loadingEl.classList.remove('hidden');
  loadingBar.style.width = '10%';
  loadingTxt.textContent = 'タイルデータを取得中...';

  try {
    const res = await fetch(WORKER_API + '/api/tiles');
    const { meta, index } = await res.json();

    if (!meta || !index) {
      loadingTxt.textContent = 'タイルデータがありません。Minecraftで /earth:rendering を実行してください。';
      document.getElementById('hdr-info').textContent = 'タイルデータ未生成';
      return;
    }

    tilesMeta  = meta;
    tilesIndex = index;

    loadingBar.style.width = '60%';
    loadingTxt.textContent = `タイル描画中 (${meta.tilesX}×${meta.tilesZ}枚)...`;

    // 既存レイヤーを削除
    if (tileLayer) map.removeLayer(tileLayer);

    // カスタムタイルレイヤーを追加
    // LeafletのCRS.Simpleではタイル座標系を手動で設定する
    tileLayer = new McTileLayer({
      tileSize: TILE_SIZE,
      minZoom: -4,
      maxZoom: 4,
      noWrap: true,
      bounds: bounds,
    }).addTo(map);

    // チャンク/国境オーバーレイを再描画
    drawChunkOverlay();

    loadingBar.style.width = '100%';
    loadingTxt.textContent = '完了';
    setTimeout(() => loadingEl.classList.add('hidden'), 600);

    // 更新日時をヘッダーに
    if (meta.lastRendered) {
      const dt = new Date(meta.lastRendered).toLocaleString('ja-JP');
      document.getElementById('hdr-info').textContent = `最終更新: ${dt}`;
    }

    // 定期チェック（60秒ごとに更新確認）
    lastRendered = meta.lastRendered || 0;
    startTileUpdateChecker();

  } catch (e) {
    loadingTxt.textContent = '取得失敗: ' + e.message;
    showError('タイルデータの取得に失敗: ' + e.message);
  }
}

// タイル更新チェック（60秒ごと）
function startTileUpdateChecker() {
  setInterval(async () => {
    try {
      const res  = await fetch(WORKER_API + '/api/tiles');
      const { meta } = await res.json();
      if (meta && meta.lastRendered && meta.lastRendered > lastRendered) {
        lastRendered = meta.lastRendered;
        // 新しいタイルデータに差し替え
        const res2 = await fetch(WORKER_API + '/api/tiles');
        const { meta: m2, index: i2 } = await res2.json();
        tilesIndex = i2;
        tilesMeta  = m2;
        if (tileLayer) { map.removeLayer(tileLayer); tileLayer = null; }
        tileLayer = new McTileLayer({ tileSize: TILE_SIZE, minZoom: -4, maxZoom: 4, noWrap: true, bounds }).addTo(map);
        showToast('🗺 マップが更新されました');
      }
    } catch {}
  }, 60000);
}

function showToast(msg) {
  const el = document.getElementById('update-toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ══════════════════════════════════════════════════════════════════════════════
// チャンク（国境）オーバーレイ — Leaflet.Rectangle で描画
// ══════════════════════════════════════════════════════════════════════════════
let chunkOverlayGroup = L.layerGroup().addTo(map);
let allChunkData = {};

const countryColors = {};
function getCountryColor(n) {
  if (!countryColors[n]) {
    let h = 0;
    for (let i = 0; i < n.length; i++) h = (h + n.charCodeAt(i) * 7) % 360;
    countryColors[n] = `hsl(${h},60%,45%)`;
  }
  return countryColors[n];
}

function drawChunkOverlay() {
  chunkOverlayGroup.clearLayers();
  for (const [name, data] of Object.entries(allChunkData)) {
    if (!data.chunks) continue;
    const color = getCountryColor(name);
    for (const chunk of data.chunks) {
      const wx1 = chunk.cx * CHUNK_SIZE;
      const wz1 = chunk.cz * CHUNK_SIZE;
      const wx2 = wx1 + CHUNK_SIZE;
      const wz2 = wz1 + CHUNK_SIZE;
      const rect = L.rectangle(
        [mcToLatLng(wx1, wz2), mcToLatLng(wx2, wz1)],
        { color, weight: 1, fillOpacity: 0.35, fillColor: color, interactive: true }
      );
      rect.on('click', () => showCountryPopup(name, data.chunkCount));
      rect.bindTooltip(name, { sticky: true, className: 'chunk-tooltip' });
      chunkOverlayGroup.addLayer(rect);
    }
  }
}

async function fetchChunkData() {
  try {
    const data = await fetch(WORKER_API + '/api/chunks').then(r => r.json());
    allChunkData = data || {};
    drawChunkOverlay();
    renderCountryList();
  } catch (e) { console.warn('チャンクデータ取得失敗:', e) }
}

// ── 国ポップアップ ─────────────────────────────────────────────────────────────
function showCountryPopup(name, count) {
  // Leafletのpopupで代用
  const popup = L.popup({ closeButton: true, className: 'mc-popup' })
    .setLatLng(map.getCenter())
    .setContent(`<b style="font-family:'Press Start 2P',monospace;font-size:10px;color:#f0c419">${name}</b><br><span style="font-size:12px;color:#8a9478">チャンク数: ${count}</span>`)
    .openOn(map);
}

// ══════════════════════════════════════════════════════════════════════════════
// ライブプレイヤー（Leaflet Marker）
// ══════════════════════════════════════════════════════════════════════════════
let liveActive = false, liveMarkers = {}, liveTimer = null;
const liveToggleBtn    = document.getElementById('btn-live-toggle');
const liveStatusChip   = document.getElementById('live-status');
const liveCountChip    = document.getElementById('live-count');
const livePlayerListEl = document.getElementById('live-player-list');

function hueFromString(s) { let h=0; for(let i=0;i<s.length;i++) h=(h+s.charCodeAt(i)*7)%360; return h; }

function createPlayerIcon(id, isLive) {
  const hue = hueFromString(id);
  const borderColor = isLive ? '#2ecc71' : '#f0c419';
  const html = `
    <div class="player-mark ${isLive?'live-mark':''}">
      <div class="label">${id}</div>
      <div class="icon" style="background:hsl(${hue},55%,40%);border-color:${borderColor}">
        ${id.charAt(0).toUpperCase()}
      </div>
    </div>`;
  return L.divIcon({ html, className: '', iconSize: [32, 56], iconAnchor: [16, 56] });
}

function upsertLiveMarker(id, x, z) {
  const latlng = mcToLatLng(x, z);
  if (liveMarkers[id]) {
    liveMarkers[id].setLatLng(latlng);
  } else {
    const marker = L.marker(latlng, { icon: createPlayerIcon(id, true), zIndexOffset: 1000 }).addTo(map);
    marker.on('click', () => map.flyTo(latlng, Math.max(map.getZoom(), 1)));
    liveMarkers[id] = marker;
  }
}
function removeLiveMarker(id) { if (liveMarkers[id]) { map.removeLayer(liveMarkers[id]); delete liveMarkers[id]; } }
function clearAllLiveMarkers() { Object.keys(liveMarkers).forEach(removeLiveMarker); }

function buildPlayerListItem(id, p) {
  const item = document.createElement('div'); item.className = 'live-list-item';
  const av   = document.createElement('div'); av.className = 'avatar'; av.style.background = `hsl(${hueFromString(id)},55%,40%)`; av.textContent = id.charAt(0).toUpperCase();
  const ai   = new Image(); ai.alt = id; ai.onload = () => { av.textContent = ''; av.appendChild(ai); }; ai.src = 'https://crafatar.com/avatars/'+encodeURIComponent(id)+'?size=28&overlay';
  const info = document.createElement('div'); info.className = 'info';
  const ne   = document.createElement('div'); ne.className = 'mcid'; ne.textContent = id;
  const co   = document.createElement('div'); co.className = 'coords'; co.textContent = `X: ${Math.round(p.x)}  Z: ${Math.round(p.z)}`;
  info.append(ne, co); item.append(av, info);
  item.addEventListener('click', () => {
    map.flyTo(mcToLatLng(p.x, p.z), Math.max(map.getZoom(), 1));
    setDetailExpanded(false, true);
  });
  return item;
}
function renderLivePlayerList(data) {
  livePlayerListEl.innerHTML = '';
  const ids = Object.keys(data || {}).filter(id => data[id] && typeof data[id].x==='number' && typeof data[id].z==='number').sort();
  if (!ids.length) { const e=document.createElement('div'); e.className='live-list-empty'; e.textContent='オンラインのプレイヤーがいません'; livePlayerListEl.appendChild(e); }
  else ids.forEach(id => livePlayerListEl.appendChild(buildPlayerListItem(id, data[id])));
}
async function refreshLive() {
  try {
    const data = await fetch(WORKER_API + '/api/players').then(r => r.json());
    const seen = {};
    Object.keys(data || {}).forEach(id => {
      const p = data[id];
      if (!p || typeof p.x !== 'number' || typeof p.z !== 'number') return;
      seen[id] = true;
      if (p.x >= MAP_BOUNDS.x1 && p.x <= MAP_BOUNDS.x2 && p.z >= MAP_BOUNDS.z1 && p.z <= MAP_BOUNDS.z2)
        upsertLiveMarker(id, p.x, p.z);
      else removeLiveMarker(id);
    });
    Object.keys(liveMarkers).forEach(id => { if (!seen[id]) removeLiveMarker(id); });
    renderLivePlayerList(data || {});
    liveStatusChip.textContent = '接続中';
    liveCountChip.textContent  = 'プレイヤー: ' + Object.keys(seen).length + '人';
  } catch (e) { liveStatusChip.textContent = '接続エラー'; showError('プレイヤー情報の取得に失敗: ' + e.message); }
}
function startLive() { liveStatusChip.textContent='接続中...'; refreshLive(); liveTimer=setInterval(refreshLive,2000); }
function stopLive()  { if(liveTimer)clearInterval(liveTimer); liveTimer=null; clearAllLiveMarkers(); livePlayerListEl.innerHTML=''; liveStatusChip.textContent='未接続'; liveCountChip.textContent='プレイヤー: 0人'; }
liveToggleBtn.addEventListener('click', () => {
  liveActive = !liveActive;
  if (liveActive) { liveToggleBtn.textContent='ライブ表示: ON'; liveToggleBtn.classList.add('danger'); startLive(); }
  else            { liveToggleBtn.textContent='ライブ表示: OFF'; liveToggleBtn.classList.remove('danger'); stopLive(); }
});
document.getElementById('tab-btn-players').addEventListener('click', () => {
  if (!liveActive) { liveActive=true; liveToggleBtn.textContent='ライブ表示: ON'; liveToggleBtn.classList.add('danger'); startLive(); }
});

// ══════════════════════════════════════════════════════════════════════════════
// 国一覧
// ══════════════════════════════════════════════════════════════════════════════
function renderCountryList() {
  const wrap = document.getElementById('country-list-wrap');
  const countEl = document.getElementById('countries-count');
  wrap.innerHTML = '';
  const names = Object.keys(allChunkData).sort((a,b) => (allChunkData[b].chunkCount||0) - (allChunkData[a].chunkCount||0));
  countEl.textContent = '国: ' + names.length + 'か国';
  if (!names.length) { const e=document.createElement('div'); e.className='country-list-empty'; e.textContent='データなし'; wrap.appendChild(e); return; }
  names.forEach(name => {
    const data = allChunkData[name];
    const item = document.createElement('div'); item.className = 'country-list-item';
    const cb   = document.createElement('div'); cb.className = 'country-color-block'; cb.style.background = getCountryColor(name);
    const ne   = document.createElement('div'); ne.className = 'country-item-name'; ne.textContent = name;
    const ci   = document.createElement('div'); ci.className = 'country-item-count'; ci.textContent = (data.chunkCount||0) + 'チャンク';
    item.append(cb, ne, ci);
    item.addEventListener('click', () => {
      if (data.chunks && data.chunks.length > 0) {
        const c = data.chunks[0];
        map.flyTo(mcToLatLng(c.cx * CHUNK_SIZE + CHUNK_SIZE/2, c.cz * CHUNK_SIZE + CHUNK_SIZE/2), 1);
        setDetailExpanded(false, true);
      }
    });
    wrap.appendChild(item);
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// ジャンプ
// ══════════════════════════════════════════════════════════════════════════════
document.getElementById('btn-jump').addEventListener('click', () => {
  const x = parseFloat(document.getElementById('input-jx').value);
  const z = parseFloat(document.getElementById('input-jz').value);
  if (isNaN(x) || isNaN(z)) { showError('X座標とZ座標を数字で入力してください'); return; }
  map.flyTo(mcToLatLng(x, z), Math.max(map.getZoom(), 1));
  document.getElementById('hdr-info').textContent = `X: ${x}  Z: ${z}`;
  setDetailExpanded(false, true);
});

// ══════════════════════════════════════════════════════════════════════════════
// パネル
// ══════════════════════════════════════════════════════════════════════════════
const panelDetail = document.getElementById('panel-detail');
const handleLabel = document.getElementById('handle-label');
const panelHandle = document.getElementById('panel-handle');
let detailExpanded = false;

function detailMaxPx() { return Math.max(100, Math.round(document.getElementById('stage').getBoundingClientRect().height * .58)); }
function setDetailExpanded(exp, skipInvalidate) {
  detailExpanded = exp;
  if (exp) { panelDetail.style.maxHeight = detailMaxPx()+'px'; panelDetail.classList.add('expanded'); handleLabel.textContent = '下にスワイプで閉じる'; }
  else      { panelDetail.style.maxHeight = '0px'; panelDetail.classList.remove('expanded'); handleLabel.textContent = '上にスワイプで一覧表示'; }
  if (!skipInvalidate) setTimeout(() => map.invalidateSize(), 340);
}

let hDragging=false, hMoved=false, hStartY=0, hStartH=0, hMaxPx=0;
function hDragStart(y) { hDragging=true; hMoved=false; hStartY=y; hStartH=panelDetail.getBoundingClientRect().height; hMaxPx=detailMaxPx(); panelDetail.style.transition='none'; panelDetail.classList.add('expanded'); }
function hDragMove(y)  { if(!hDragging)return; const dy=hStartY-y; if(Math.abs(dy)>6)hMoved=true; panelDetail.style.maxHeight=Math.min(Math.max(hStartH+dy,0),hMaxPx)+'px'; }
function hDragEnd()    { if(!hDragging)return; hDragging=false; panelDetail.style.transition=''; if(!hMoved){setDetailExpanded(!detailExpanded);return;} setDetailExpanded(panelDetail.getBoundingClientRect().height>hMaxPx*.3); }
panelHandle.addEventListener('touchstart', e => hDragStart(e.touches[0].clientY), {passive:true});
panelHandle.addEventListener('touchmove',  e => { if(!hDragging)return; e.preventDefault(); hDragMove(e.touches[0].clientY); }, {passive:false});
panelHandle.addEventListener('touchend', hDragEnd); panelHandle.addEventListener('touchcancel', hDragEnd);
panelHandle.addEventListener('mousedown', e => { hDragStart(e.clientY); const mm=e2=>hDragMove(e2.clientY),mu=()=>{hDragEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu); });

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('live-player-list').style.display    = (name==='live')      ? 'flex'  : 'none';
  document.getElementById('country-list-wrap').style.display   = (name==='countries') ? 'flex'  : 'none';
  if (name==='jump') { setDetailExpanded(false); panelHandle.style.opacity='.4'; handleLabel.textContent=''; }
  else               { panelDetail.style.display=''; panelHandle.style.opacity='1'; }
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// ══════════════════════════════════════════════════════════════════════════════
// エラー表示
// ══════════════════════════════════════════════════════════════════════════════
let errorTimer = null;
function showError(msg) {
  const banner = document.getElementById('error-banner');
  banner.textContent = msg; banner.classList.add('show');
  if (errorTimer) clearTimeout(errorTimer);
  errorTimer = setTimeout(() => banner.classList.remove('show'), 5000);
}

// ══════════════════════════════════════════════════════════════════════════════
// 起動
// ══════════════════════════════════════════════════════════════════════════════
loadTileMap();
fetchChunkData();
setInterval(fetchChunkData, 10000);

// パネルサイズ変更時にLeafletに通知
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('panel'));
</script>
</body>
</html>
