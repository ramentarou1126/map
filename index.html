<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>麺Earth MAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --c-bg:        #0d0f0b;
  --c-panel:     #141710;
  --c-border:    #2a2f1e;
  --c-border-hi: #3d4a28;
  --c-grass:     #5a9e2f;
  --c-grass-hi:  #7dc845;
  --c-gold:      #e8b84b;
  --c-gold-dim:  #8a6b1e;
  --c-diamond:   #4ecdc4;
  --c-redstone:  #c0392b;
  --c-emerald:   #27ae60;
  --c-text:      #dde0d0;
  --c-text-dim:  #6b7560;
  --c-text-mute: #3d4530;
  --font-px: 'Press Start 2P', monospace;
  --font-ui: 'Noto Sans JP', sans-serif;
  --panel-h: 220px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--c-bg); color: var(--c-text); font-family: var(--font-ui); }
body { display: flex; flex-direction: column; }

/* ── HEADER ── */
#header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px;
  background: var(--c-panel);
  border-bottom: 3px solid var(--c-border-hi);
}
#header-logo {
  font-family: var(--font-px); font-size: 11px; color: var(--c-gold);
  text-shadow: 0 2px 0 #000; white-space: nowrap; flex-shrink: 0;
}
#header-logo span { color: var(--c-grass-hi); }
#header-coord {
  flex: 1; min-width: 0;
  font-family: monospace; font-size: 12px; color: var(--c-emerald);
  background: rgba(0,0,0,.5); border: 1px solid var(--c-border);
  padding: 5px 10px; border-radius: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── ERROR ── */
#error-banner {
  display: none; flex: 0 0 auto;
  background: var(--c-redstone); color: #fff;
  font-size: 12px; padding: 7px 14px; text-align: center;
}
#error-banner.show { display: block; }

/* ── STAGE ── */
#stage { flex: 1; position: relative; overflow: hidden; min-height: 0; }
#map-area { position: absolute; inset: 0; overflow: hidden; background: #060a12; }
#map-img { position: absolute; image-rendering: pixelated; display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; }
#chunk-canvas { position: absolute; top: 0; left: 0; display: block; cursor: crosshair; }

/* ── MARKERS ── */
#tap-mark, #jump-mark { position: absolute; transform: translate(-50%,-50%); pointer-events: none; display: none; z-index: 10; }
#tap-mark { width: 20px; height: 20px; }
#tap-mark::before, #tap-mark::after { content: ''; position: absolute; background: var(--c-emerald); }
#tap-mark::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
#tap-mark::after  { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
#jump-mark { width: 24px; height: 24px; z-index: 15; }
#jump-mark::before, #jump-mark::after { content: ''; position: absolute; background: var(--c-redstone); box-shadow: 0 0 8px rgba(192,57,43,.7); }
#jump-mark::before { left: 50%; top: 0; width: 3px; height: 24px; transform: translateX(-50%); }
#jump-mark::after  { top: 50%; left: 0; width: 24px; height: 3px; transform: translateY(-50%); }

.player-mark { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 20; }
.player-mark .p-label { font-family: var(--font-px); font-size: 7px; color: #fff; background: rgba(0,0,0,.8); padding: 2px 5px; border-radius: 2px; margin-bottom: 3px; white-space: nowrap; border: 1px solid var(--c-gold-dim); }
.player-mark .p-icon { width: 28px; height: 28px; border: 2px solid var(--c-gold); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 14px; overflow: hidden; box-shadow: 0 0 8px rgba(232,184,75,.4); }
.player-mark .p-icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.live-mark .p-icon { border-color: var(--c-emerald); box-shadow: 0 0 8px rgba(39,174,96,.6); }
.live-mark .p-icon::after { content: ''; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-emerald); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

#tooltip {
  position: absolute; background: rgba(8,12,8,.95); border: 1px solid var(--c-emerald);
  color: var(--c-emerald); font-family: var(--font-px); font-size: 8px;
  padding: 5px 9px; border-radius: 2px; pointer-events: none; display: none; z-index: 30; white-space: nowrap;
}
#country-info {
  position: absolute; background: rgba(8,12,8,.97); border: 2px solid var(--c-gold);
  color: var(--c-text); font-family: var(--font-ui); font-size: 13px;
  padding: 10px 14px; border-radius: 3px; pointer-events: none; display: none; z-index: 31; min-width: 110px;
}
#country-info .ci-name { font-family: var(--font-px); font-size: 10px; color: var(--c-gold); margin-bottom: 5px; }
#country-info .ci-count { font-size: 12px; color: var(--c-text-dim); }

/* ── ZOOM BUTTONS ── */
#zoom-controls { position: absolute; right: 10px; bottom: calc(var(--panel-h) + 10px); z-index: 25; display: flex; flex-direction: column; gap: 5px; }
.zoom-btn {
  width: 40px; height: 40px; font-size: 20px; color: #fff; cursor: pointer;
  background: var(--c-panel); border: 2px solid var(--c-border-hi);
  border-radius: 2px; display: flex; align-items: center; justify-content: center;
  user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: background .1s;
}
.zoom-btn:active { background: var(--c-border-hi); }

/* ── BOTTOM PANEL ── */
#panel {
  flex: 0 0 auto;
  background: var(--c-panel);
  border-top: 3px solid var(--c-border-hi);
  display: flex; flex-direction: column;
  max-height: 88vh;
  transition: max-height .3s cubic-bezier(.2,.8,.2,1);
}
#panel-drag {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 12px 4px; cursor: grab; touch-action: none; user-select: none;
}
.drag-bar { width: 40px; height: 4px; border-radius: 2px; background: var(--c-border-hi); }
#drag-hint { font-family: var(--font-px); font-size: 7px; color: var(--c-text-mute); min-height: 9px; }

/* ── TABS ── */
.tabs { display: flex; gap: 0; flex: 0 0 auto; border-bottom: 2px solid var(--c-border); }
.tab-btn {
  flex: 1; font-family: var(--font-px); font-size: 9px; color: var(--c-text-dim);
  padding: 10px 4px; background: transparent; border: none; border-bottom: 3px solid transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: color .15s, border-color .15s;
}
.tab-btn.active { color: var(--c-gold); border-bottom-color: var(--c-gold); }

/* ── TAB CONTENTS ── */
.tab-content { display: none; flex-direction: column; gap: 8px; padding: 10px 12px 8px; flex: 0 0 auto; }
.tab-content.active { display: flex; }

.field-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.field-group { display: flex; flex-direction: column; gap: 3px; }
.field-label { font-family: var(--font-px); font-size: 7px; color: var(--c-gold); }
input[type=number] {
  background: #080b06; border: 2px solid var(--c-border-hi); color: var(--c-text);
  font-size: 14px; padding: 7px 10px; border-radius: 2px; width: 96px;
  outline: none; -moz-appearance: textfield;
}
input[type=number]::-webkit-inner-spin-button { display: none; }
input[type=number]:focus { border-color: var(--c-diamond); }

.chip {
  font-size: 12px; color: var(--c-text-dim); background: rgba(0,0,0,.4);
  border: 1px solid var(--c-border); padding: 6px 10px; border-radius: 2px; white-space: nowrap;
}

/* ── BUTTONS ── */
.btn {
  font-family: var(--font-px); font-size: 9px; color: #fff; padding: 9px 13px;
  border: none; border-radius: 2px; cursor: pointer; white-space: nowrap;
  text-shadow: 0 1px 0 #000; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: filter .1s;
}
.btn:active { filter: brightness(.85); }
.btn-green  { background: var(--c-grass);   }
.btn-red    { background: var(--c-redstone); }
.btn-blue   { background: #1e6b82; }

/* ── SCROLLABLE DETAIL ── */
#panel-detail {
  flex: 0 0 auto; overflow: hidden; max-height: 0;
  transition: max-height .32s cubic-bezier(.2,.8,.2,1);
}
#panel-detail.expanded { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ── PLAYER LIST ── */
#live-player-list { display: flex; flex-direction: column; gap: 5px; padding: 6px 12px 0; }
.list-empty { font-size: 12px; color: var(--c-text-dim); text-align: center; padding: 12px 0; }
.list-item {
  display: flex; align-items: center; gap: 9px;
  background: rgba(0,0,0,.35); border: 1px solid var(--c-border);
  border-radius: 3px; padding: 7px 10px; cursor: pointer;
  transition: border-color .15s;
}
.list-item:active { border-color: var(--c-border-hi); }
.avatar {
  width: 28px; height: 28px; flex-shrink: 0; border-radius: 2px;
  border: 2px solid var(--c-emerald); background: #111;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 900; font-size: 13px; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.item-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.item-name { font-size: 13px; font-weight: 700; color: var(--c-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-sub  { font-size: 11px; color: var(--c-text-dim); }

/* ── COUNTRY LIST ── */
#country-list { display: flex; flex-direction: column; gap: 5px; padding: 6px 12px 8px; }
.country-item {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,.35); border: 1px solid var(--c-border);
  border-radius: 3px; padding: 8px 10px; cursor: pointer;
  transition: border-color .15s;
}
.country-item:active { border-color: var(--c-gold-dim); }
.country-swatch { width: 18px; height: 18px; flex-shrink: 0; border-radius: 2px; border: 1px solid rgba(255,255,255,.15); }
.country-item-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.country-item-name { font-size: 13px; font-weight: 700; color: var(--c-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.country-item-sub  { font-size: 11px; color: var(--c-text-dim); }
.country-item-chunks { flex-shrink: 0; font-family: var(--font-px); font-size: 8px; color: var(--c-gold); }

/* ── OUTSIDE SECTION ── */
#outside-section { display: none; padding: 0 12px 14px; }
.section-sep { height: 1px; background: var(--c-border); margin: 10px 0; }
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.section-title { font-family: var(--font-px); font-size: 8px; color: var(--c-gold); flex: 1; }
.outside-item { border-color: var(--c-gold-dim); }
.outside-item .avatar { border-color: var(--c-gold-dim); }
.outside-item .item-sub { color: var(--c-gold); }
</style>
</head>
<body>

<div id="header">
  <div id="header-logo">⛏ 麺<span>Earth</span></div>
  <div id="header-coord">マップをタップしてください</div>
</div>
<div id="error-banner"></div>

<div id="stage">
  <div id="map-area">
    <img id="map-img" src="map-image.jpg" alt="map">
    <canvas id="chunk-canvas"></canvas>
    <div id="tap-mark"></div>
    <div id="jump-mark"></div>
    <div id="tooltip"></div>
    <div id="country-info"></div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">−</button>
    </div>
  </div>

  <div id="panel">
    <div id="panel-drag">
      <div class="drag-bar"></div>
      <div id="drag-hint">上にスワイプで一覧表示</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="live">👤 プレイヤー</button>
      <button class="tab-btn" data-tab="nations">🌍 国家</button>
      <button class="tab-btn" data-tab="jump">🎯 座標</button>
    </div>

    <!-- プレイヤータブ -->
    <div class="tab-content active" id="tab-live">
      <div class="field-row">
        <button class="btn btn-green" id="btn-live-toggle">ライブ表示: OFF</button>
        <div class="chip" id="live-status">未接続</div>
        <div class="chip" id="live-count">0人</div>
      </div>
    </div>

    <!-- 国家タブ -->
    <div class="tab-content" id="tab-nations">
      <div class="field-row">
        <div class="chip" id="nations-count">読み込み中...</div>
      </div>
    </div>

    <!-- 座標タブ -->
    <div class="tab-content" id="tab-jump">
      <div class="field-row">
        <div class="field-group">
          <div class="field-label">MC X</div>
          <input type="number" id="input-jx" placeholder="7152">
        </div>
        <div class="field-group">
          <div class="field-label">MC Z</div>
          <input type="number" id="input-jz" placeholder="-1820">
        </div>
        <button class="btn btn-blue" id="btn-jump">ジャンプ</button>
      </div>
    </div>

    <!-- スクロール領域 -->
    <div id="panel-detail">
      <!-- プレイヤーリスト -->
      <div id="live-player-list"></div>
      <!-- マップ外 -->
      <div id="outside-section">
        <div class="section-sep"></div>
        <div class="section-head">
          <span>🌐</span>
          <span class="section-title">マップ外に出た記録</span>
          <span class="chip" id="outside-count">0人</span>
        </div>
        <div id="outside-player-list"></div>
      </div>
      <!-- 国家リスト -->
      <div id="country-list"></div>
    </div>
  </div>
</div>

<script>
'use strict';

// ===== 設定 =====
const WORKER_API  = 'WORKER_API_URL';
const MAP_BOUNDS  = { x1: -9215, z1: -4607, x2: 9215, z2: 4607 };
const IMG_W = 1539, IMG_H = 769;
const CONV  = { cx: 51.26, ox: -4, cz: 51.22, oz: 1 };
const CHUNK_SIZE = 16;

// ===== 要素 =====
const $ = id => document.getElementById(id);
const mapArea     = $('map-area');
const mapImg      = $('map-img');
const chunkCanvas = $('chunk-canvas');
const tapMark     = $('tap-mark');
const jumpMark    = $('jump-mark');
const tooltip     = $('tooltip');
const countryInfoBox = $('country-info');
const hdrCoord    = $('header-coord');
const errorBanner = $('error-banner');

// ===== エラー表示 =====
let errTimer = null;
function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('show');
  if (errTimer) clearTimeout(errTimer);
  errTimer = setTimeout(() => errorBanner.classList.remove('show'), 5000);
}

// ===== 国色 =====
const countryColors = {};
function hueFromStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h + s.charCodeAt(i) * 7) % 360; return h; }
function getColor(name) {
  if (!countryColors[name]) countryColors[name] = `hsl(${hueFromStr(name)},55%,42%)`;
  return countryColors[name];
}

// ===== 座標変換 =====
const view = { x: 0, y: 0, scale: 1 };
function mcToGeo(x, z) { return { lat: (-(z - CONV.oz) / CONV.cz).toFixed(4), lng: ((x - CONV.ox) / CONV.cx).toFixed(4) }; }
function mcToPixel(x, z) { return { x: view.x + (x - MAP_BOUNDS.x1) / (MAP_BOUNDS.x2 - MAP_BOUNDS.x1) * IMG_W * view.scale, y: view.y + (z - MAP_BOUNDS.z1) / (MAP_BOUNDS.z2 - MAP_BOUNDS.z1) * IMG_H * view.scale }; }
function pixelToMc(px, py) { return { x: Math.round(MAP_BOUNDS.x1 + (px - view.x) / (IMG_W * view.scale) * (MAP_BOUNDS.x2 - MAP_BOUNDS.x1)), z: Math.round(MAP_BOUNDS.z1 + (py - view.y) / (IMG_H * view.scale) * (MAP_BOUNDS.z2 - MAP_BOUNDS.z1)) }; }
function isInBounds(x, z) { return x >= MAP_BOUNDS.x1 && x <= MAP_BOUNDS.x2 && z >= MAP_BOUNDS.z1 && z <= MAP_BOUNDS.z2; }

// ===== ビュー管理 =====
function panelHeight() { return document.getElementById('panel').getBoundingClientRect().height || 0; }
function avail() { const r = mapArea.getBoundingClientRect(); return { w: r.width, h: Math.max(r.height - panelHeight(), 100) }; }
function fitView() {
  const r = mapArea.getBoundingClientRect(), a = avail();
  view.scale = Math.min(r.width / IMG_W, a.h / IMG_H);
  view.x = (r.width - IMG_W * view.scale) / 2;
  view.y = (a.h - IMG_H * view.scale) / 2;
  applyView();
}
function clampView() {
  const r = mapArea.getBoundingClientRect(), a = avail();
  const cw = IMG_W * view.scale, ch = IMG_H * view.scale;
  view.x = cw <= r.width  ? (r.width  - cw) / 2 : Math.min(0, Math.max(r.width  - cw, view.x));
  view.y = ch <= a.h      ? (a.h      - ch) / 2 : Math.min(0, Math.max(a.h      - ch, view.y));
}
function applyView() {
  mapImg.style.cssText = `width:${IMG_W*view.scale}px;height:${IMG_H*view.scale}px;left:${view.x}px;top:${view.y}px`;
  const r = mapArea.getBoundingClientRect();
  chunkCanvas.width = r.width; chunkCanvas.height = r.height;
  updateAllMarkers(); drawChunks();
}
function zoomAt(cx, cy, f) {
  const r = mapArea.getBoundingClientRect(), a = avail();
  const minS = Math.min(r.width / IMG_W, a.h / IMG_H);
  const ns = Math.min(Math.max(view.scale * f, minS), 15);
  const ox = cx - r.left, oy = cy - r.top;
  view.x = ox - (ox - view.x) * (ns / view.scale);
  view.y = oy - (oy - view.y) * (ns / view.scale);
  view.scale = ns; clampView(); applyView();
}

// ===== チャンク描画 =====
let chunkData = {};
async function fetchChunks() {
  try {
    chunkData = await fetch(WORKER_API + '/api/chunks').then(r => r.json()) || {};
    drawChunks();
    renderCountryList();
  } catch (e) { console.warn('チャンク取得失敗:', e); }
}
function drawChunks() {
  const ctx = chunkCanvas.getContext('2d');
  ctx.clearRect(0, 0, chunkCanvas.width, chunkCanvas.height);
  for (const name in chunkData) {
    const cd = chunkData[name];
    if (!cd.chunks) continue;
    const col = getColor(name);
    ctx.fillStyle = col; ctx.globalAlpha = 0.45;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.75;
    for (const c of cd.chunks) {
      const sx = c.cx * CHUNK_SIZE, sz = c.cz * CHUNK_SIZE;
      const p1 = mcToPixel(sx, sz), p2 = mcToPixel(sx + CHUNK_SIZE, sz + CHUNK_SIZE);
      const pw = Math.abs(p2.x - p1.x), ph = Math.abs(p2.y - p1.y);
      const px = Math.min(p1.x, p2.x), py = Math.min(p1.y, p2.y);
      ctx.globalAlpha = 0.45; ctx.fillStyle = col; ctx.fillRect(px, py, pw, ph);
      ctx.globalAlpha = 0.75; ctx.strokeRect(px, py, pw, ph);
    }
  }
  ctx.globalAlpha = 1;
}
function getCountryAtPx(px, py) {
  const mc = pixelToMc(px, py);
  const cx = Math.floor(mc.x / CHUNK_SIZE), cz = Math.floor(mc.z / CHUNK_SIZE);
  for (const name in chunkData) {
    const cd = chunkData[name];
    if (cd.chunks && cd.chunks.find(c => c.cx === cx && c.cz === cz)) return { name, count: cd.chunkCount };
  }
  return null;
}
function showCountryInfoAt(px, py) {
  const info = getCountryAtPx(px, py);
  if (!info) { countryInfoBox.style.display = 'none'; return; }
  countryInfoBox.innerHTML = `<div class="ci-name">${info.name}</div><div class="ci-count">チャンク: ${info.count}</div>`;
  countryInfoBox.style.display = 'block';
  let x = px + 12, y = py - 42;
  if (x + 140 > chunkCanvas.width) x = px - 152;
  if (y < 0) y = py + 18;
  countryInfoBox.style.left = x + 'px'; countryInfoBox.style.top = y + 'px';
}

// ===== マーカー =====
let currentJumpMc = null;
function updateAllMarkers() {
  if (currentJumpMc && jumpMark.style.display !== 'none') {
    const p = mcToPixel(currentJumpMc.x, currentJumpMc.z);
    jumpMark.style.left = p.x + 'px'; jumpMark.style.top = p.y + 'px';
  }
  updateLivePositions();
}

// ===== マップタップ =====
let tipTimer = null;
function onMapTap(cx, cy) {
  const r = mapArea.getBoundingClientRect();
  const lx = cx - r.left, ly = cy - r.top;
  if (lx < view.x || lx > view.x + IMG_W * view.scale || ly < view.y || ly > view.y + IMG_H * view.scale) return;
  tapMark.style.display = 'block'; tapMark.style.left = lx + 'px'; tapMark.style.top = ly + 'px';
  const mc = pixelToMc(lx, ly), geo = mcToGeo(mc.x, mc.z);
  hdrCoord.textContent = `X: ${mc.x}  Z: ${mc.z}  |  ${geo.lat}°N  ${geo.lng}°E`;
  tooltip.textContent = `X: ${mc.x}  Z: ${mc.z}`;
  tooltip.style.display = 'block';
  let tx = lx + 10, ty = ly - 28;
  if (tx + 160 > r.width) tx = lx - 170;
  if (ty < 0) ty = ly + 12;
  tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
  if (tipTimer) clearTimeout(tipTimer);
  tipTimer = setTimeout(() => tooltip.style.display = 'none', 2500);
  showCountryInfoAt(lx, ly);
  setTimeout(() => countryInfoBox.style.display = 'none', 3000);
}

// ===== ジャンプ =====
function doJump() {
  const x = parseFloat($('input-jx').value), z = parseFloat($('input-jz').value);
  if (isNaN(x) || isNaN(z)) { showError('X・Z座標を数字で入力してください'); return; }
  currentJumpMc = { x, z }; zoomToMc(x, z, 4);
  const geo = mcToGeo(x, z);
  hdrCoord.textContent = `X: ${x}  Z: ${z}  |  ${geo.lat}°N  ${geo.lng}°E`;
  jumpMark.style.display = 'block';
  const p = mcToPixel(x, z); jumpMark.style.left = p.x + 'px'; jumpMark.style.top = p.y + 'px';
}
function zoomToMc(x, z, target) {
  const r = mapArea.getBoundingClientRect(), a = avail();
  const minS = Math.min(r.width / IMG_W, a.h / IMG_H);
  const ns = Math.min(Math.max(target, minS), 15);
  const rx = (x - MAP_BOUNDS.x1) / (MAP_BOUNDS.x2 - MAP_BOUNDS.x1);
  const rz = (z - MAP_BOUNDS.z1) / (MAP_BOUNDS.z2 - MAP_BOUNDS.z1);
  view.x = r.width / 2 - rx * IMG_W * ns;
  view.y = a.h / 2 - rz * IMG_H * ns;
  view.scale = ns; clampView(); applyView(); setExpanded(false);
}

// ===== パネル開閉 =====
const panelDetail = $('panel-detail');
const dragHint    = $('drag-hint');
const panelDrag   = $('panel-drag');
let expanded = false;
function detailMax() { return Math.max(100, Math.round($('stage').getBoundingClientRect().height * 0.58)); }
function setExpanded(v) {
  expanded = v;
  panelDetail.style.maxHeight = v ? detailMax() + 'px' : '0px';
  panelDetail.classList.toggle('expanded', v);
  dragHint.textContent = v ? '下にスワイプで閉じる' : '上にスワイプで一覧表示';
  setTimeout(fitView, 350);
}

let hDrag = false, hMoved = false, hSY = 0, hSH = 0, hMax = 0;
function hStart(y) {
  hDrag = true; hMoved = false; hSY = y;
  hSH = panelDetail.getBoundingClientRect().height; hMax = detailMax();
  panelDetail.style.transition = 'none'; panelDetail.classList.add('expanded');
}
function hMove(y) {
  if (!hDrag) return;
  const dy = hSY - y;
  if (Math.abs(dy) > 6) hMoved = true;
  panelDetail.style.maxHeight = Math.min(Math.max(hSH + dy, 0), hMax) + 'px';
  fitView();
}
function hEnd() {
  if (!hDrag) return; hDrag = false;
  panelDetail.style.transition = '';
  if (!hMoved) { setExpanded(!expanded); return; }
  setExpanded(panelDetail.getBoundingClientRect().height > hMax * 0.3);
}
panelDrag.addEventListener('touchstart', e => hStart(e.touches[0].clientY), { passive: true });
panelDrag.addEventListener('touchmove',  e => { if (!hDrag) return; e.preventDefault(); hMove(e.touches[0].clientY); }, { passive: false });
panelDrag.addEventListener('touchend',   hEnd);
panelDrag.addEventListener('touchcancel',hEnd);
panelDrag.addEventListener('mousedown',  e => {
  hStart(e.clientY);
  const mm = e2 => hMove(e2.clientY);
  const mu = () => { hEnd(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
  window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
});

// ===== タブ =====
let currentTab = 'live';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  $('tab-' + name).classList.add('active');

  // 国家タブに切り替え時はリスト表示、それ以外はプレイヤーリスト
  $('live-player-list').style.display  = name === 'live'    ? '' : 'none';
  $('outside-section').style.display   = name === 'live'    ? outsideSectionVisible ? '' : 'none' : 'none';
  $('country-list').style.display      = name === 'nations' ? '' : 'none';

  if (name === 'jump') {
    panelDetail.style.display = 'none';
    panelDrag.style.opacity   = '0.4';
    dragHint.textContent      = '';
  } else {
    panelDetail.style.display = '';
    panelDrag.style.opacity   = '1';
    dragHint.textContent      = expanded ? '下にスワイプで閉じる' : '上にスワイプで一覧表示';
  }

  // 国家タブ切り替え時は即展開
  if (name === 'nations') setExpanded(true);
  else if (name !== 'jump') setExpanded(false);
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// ===== 国家リスト =====
function renderCountryList() {
  const el = $('country-list');
  el.innerHTML = '';
  const names = Object.keys(chunkData).sort((a, b) => (chunkData[b].chunkCount || 0) - (chunkData[a].chunkCount || 0));
  $('nations-count').textContent = `${names.length}国`;
  if (!names.length) {
    const e = document.createElement('div');
    e.className = 'list-empty'; e.textContent = 'チャンクデータがありません';
    el.appendChild(e); return;
  }
  for (const name of names) {
    const cd = chunkData[name];
    const item = document.createElement('div');
    item.className = 'country-item';
    const swatch = document.createElement('div');
    swatch.className = 'country-swatch';
    swatch.style.background = getColor(name);
    const info = document.createElement('div');
    info.className = 'country-item-info';
    const nm = document.createElement('div');
    nm.className = 'country-item-name'; nm.textContent = name;
    const sub = document.createElement('div');
    sub.className = 'country-item-sub'; sub.textContent = `チャンク数: ${cd.chunkCount || 0}`;
    info.append(nm, sub);
    item.append(swatch, info);

    // タップ→国の最初のチャンクにズーム
    item.addEventListener('click', () => {
      if (cd.chunks && cd.chunks.length > 0) {
        const c = cd.chunks[0];
        const mcx = c.cx * CHUNK_SIZE + CHUNK_SIZE / 2;
        const mcz = c.cz * CHUNK_SIZE + CHUNK_SIZE / 2;
        zoomToMc(mcx, mcz, 6);
        switchTab('live');
      }
    });
    el.appendChild(item);
  }
}

// ===== ライブ =====
let liveOn = false, liveMarkers = {}, liveTimer = null;
const liveToggle = $('btn-live-toggle');
const liveStatus = $('live-status');
const liveCount  = $('live-count');
const liveList   = $('live-player-list');

function upsertMarker(id, x, z) {
  let e = liveMarkers[id];
  if (!e) {
    const el = document.createElement('div');
    el.className = 'player-mark live-mark';
    const lb = document.createElement('div'); lb.className = 'p-label'; lb.textContent = id;
    const ic = document.createElement('div'); ic.className = 'p-icon';
    ic.style.background = `hsl(${hueFromStr(id)},55%,35%)`; ic.textContent = id[0].toUpperCase();
    const ai = new Image(); ai.alt = id;
    ai.onload = () => { ic.textContent = ''; ic.appendChild(ai); };
    ai.src = `https://crafatar.com/avatars/${encodeURIComponent(id)}?size=32&overlay`;
    el.append(lb, ic); mapArea.appendChild(el);
    e = { el }; liveMarkers[id] = e;
  }
  e.x = x; e.z = z;
  const p = mcToPixel(x, z); e.el.style.left = p.x + 'px'; e.el.style.top = p.y + 'px';
}
function removeMarker(id) { const e = liveMarkers[id]; if (!e) return; e.el.remove(); delete liveMarkers[id]; }
function clearMarkers() { Object.keys(liveMarkers).forEach(removeMarker); }
function updateLivePositions() { Object.values(liveMarkers).forEach(e => { const p = mcToPixel(e.x, e.z); e.el.style.left = p.x + 'px'; e.el.style.top = p.y + 'px'; }); }

function buildListItem(id, p) {
  const item = document.createElement('div'); item.className = 'list-item';
  const av = document.createElement('div'); av.className = 'avatar';
  av.style.background = `hsl(${hueFromStr(id)},55%,35%)`; av.textContent = id[0].toUpperCase();
  const ai = new Image(); ai.alt = id;
  ai.onload = () => { av.textContent = ''; av.appendChild(ai); };
  ai.src = `https://crafatar.com/avatars/${encodeURIComponent(id)}?size=28&overlay`;
  const info = document.createElement('div'); info.className = 'item-info';
  const nm = document.createElement('div'); nm.className = 'item-name'; nm.textContent = id;
  const co = document.createElement('div'); co.className = 'item-sub'; co.textContent = `X: ${Math.round(p.x)}  Z: ${Math.round(p.z)}`;
  info.append(nm, co); item.append(av, info);
  item.addEventListener('click', () => zoomToMc(p.x, p.z, 6));
  return item;
}

function renderPlayerList(data) {
  liveList.innerHTML = '';
  const ids = Object.keys(data || {}).filter(id => { const p = data[id]; return p && typeof p.x === 'number' && isInBounds(p.x, p.z); }).sort();
  if (!ids.length) { const e = document.createElement('div'); e.className = 'list-empty'; e.textContent = 'オンラインのプレイヤーがいません'; liveList.appendChild(e); return; }
  ids.forEach(id => liveList.appendChild(buildListItem(id, data[id])));
}

async function refreshLive() {
  try {
    const data = await fetch(WORKER_API + '/api/players').then(r => r.json());
    const seen = {};
    Object.keys(data || {}).forEach(id => {
      const p = data[id]; if (!p || typeof p.x !== 'number') return;
      seen[id] = true;
      if (isInBounds(p.x, p.z)) upsertMarker(id, p.x, p.z); else removeMarker(id);
    });
    Object.keys(liveMarkers).forEach(id => { if (!seen[id]) removeMarker(id); });
    renderPlayerList(data || {});
    liveStatus.textContent = '接続中';
    liveCount.textContent  = Object.keys(seen).length + '人';
  } catch (e) {
    liveStatus.textContent = 'エラー';
    showError('プレイヤー情報の取得に失敗しました');
  }
}
function startLive() { liveStatus.textContent = '接続中...'; refreshLive(); liveTimer = setInterval(refreshLive, 2000); }
function stopLive()  { clearInterval(liveTimer); liveTimer = null; clearMarkers(); liveList.innerHTML = ''; liveStatus.textContent = '未接続'; liveCount.textContent = '0人'; }

liveToggle.addEventListener('click', () => {
  liveOn = !liveOn;
  liveToggle.textContent = liveOn ? 'ライブ表示: ON' : 'ライブ表示: OFF';
  liveToggle.className   = liveOn ? 'btn btn-red' : 'btn btn-green';
  if (liveOn) startLive(); else stopLive();
});

// プレイヤータブ選択時に自動ON
document.querySelector('[data-tab="live"]').addEventListener('click', () => {
  if (!liveOn) { liveOn = true; liveToggle.textContent = 'ライブ表示: ON'; liveToggle.className = 'btn btn-red'; startLive(); }
});

// ===== マップ外履歴 =====
let outsideSectionVisible = false;
async function refreshOutside() {
  try {
    const raw = await fetch(WORKER_API + '/api/outside_history').then(r => r.json());
    const history = {};
    Object.keys(raw || {}).forEach(id => { const r = raw[id]; if (r && typeof r.x === 'number' && r.time) history[id] = { x: r.x, z: r.z, time: new Date(r.time) }; });
    const ids = Object.keys(history);
    outsideSectionVisible = ids.length > 0;
    const sec = $('outside-section');
    if (!ids.length || currentTab !== 'live') { sec.style.display = 'none'; return; }
    sec.style.display = '';
    $('outside-count').textContent = ids.length + '人';
    const ol = $('outside-player-list'); ol.innerHTML = '';
    ids.sort((a,b) => history[b].time - history[a].time).forEach(id => {
      const r = history[id];
      const item = document.createElement('div'); item.className = 'list-item outside-item';
      const av = document.createElement('div'); av.className = 'avatar'; av.style.background = `hsl(${hueFromStr(id)},55%,35%)`; av.textContent = id[0].toUpperCase();
      const info = document.createElement('div'); info.className = 'item-info';
      const nm = document.createElement('div'); nm.className = 'item-name'; nm.textContent = id;
      const t = r.time; const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      const co = document.createElement('div'); co.className = 'item-sub'; co.textContent = `X: ${Math.round(r.x)}  Z: ${Math.round(r.z)}  ${ts} に検出`;
      info.append(nm, co); item.append(av, info);
      item.addEventListener('click', () => zoomToMc(Math.min(Math.max(r.x, MAP_BOUNDS.x1), MAP_BOUNDS.x2), Math.min(Math.max(r.z, MAP_BOUNDS.z1), MAP_BOUNDS.z2), 2));
      ol.appendChild(item);
    });
  } catch {}
}

// ===== タッチ / マウス操作 =====
let ptrs = {}, panOn = false, panLX = 0, panLY = 0, pinchOn = false, pinchD = 0, pinchMX = 0, pinchMY = 0, isTap = false, tapSX = 0, tapSY = 0, tapST = 0;
function onTS(e) {
  if (e.target.closest('#zoom-controls') || e.target.closest('#panel')) return;
  e.preventDefault();
  for (const t of e.changedTouches) ptrs[t.identifier] = { x: t.clientX, y: t.clientY };
  const k = Object.keys(ptrs);
  if (k.length === 1) { const p = ptrs[k[0]]; panOn = true; pinchOn = false; panLX = p.x; panLY = p.y; isTap = true; tapSX = p.x; tapSY = p.y; tapST = Date.now(); }
  else if (k.length === 2) { panOn = false; pinchOn = true; isTap = false; const a = ptrs[k[0]], b = ptrs[k[1]]; pinchD = Math.hypot(b.x-a.x,b.y-a.y); pinchMX = (a.x+b.x)/2; pinchMY = (a.y+b.y)/2; }
}
function onTM(e) {
  if (e.target.closest('#panel')) return;
  e.preventDefault();
  for (const t of e.changedTouches) ptrs[t.identifier] = { x: t.clientX, y: t.clientY };
  const k = Object.keys(ptrs);
  if (k.length === 1 && panOn) {
    const p = ptrs[k[0]], dx = p.x - panLX, dy = p.y - panLY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isTap = false;
    view.x += dx; view.y += dy; panLX = p.x; panLY = p.y; clampView(); applyView();
  } else if (k.length === 2 && pinchOn) {
    const a = ptrs[k[0]], b = ptrs[k[1]];
    const d = Math.hypot(b.x-a.x,b.y-a.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    zoomAt(pinchMX, pinchMY, d / pinchD);
    view.x += mx - pinchMX; view.y += my - pinchMY;
    pinchD = d; pinchMX = mx; pinchMY = my; clampView(); applyView();
  }
}
function onTE(e) {
  for (const t of e.changedTouches) delete ptrs[t.identifier];
  const rem = Object.keys(ptrs).length;
  if (rem === 0) { if (isTap && Date.now() - tapST < 300) onMapTap(tapSX, tapSY); panOn = false; pinchOn = false; isTap = false; }
  else if (rem === 1) { pinchOn = false; panOn = true; isTap = false; const p = ptrs[Object.keys(ptrs)[0]]; panLX = p.x; panLY = p.y; }
}
chunkCanvas.addEventListener('touchstart',  onTS, { passive: false });
chunkCanvas.addEventListener('touchmove',   onTM, { passive: false });
chunkCanvas.addEventListener('touchend',    onTE, { passive: false });
chunkCanvas.addEventListener('touchcancel', e => { for (const t of e.changedTouches) delete ptrs[t.identifier]; panOn = false; pinchOn = false; isTap = false; }, { passive: false });

let mDrag = false, mLX = 0, mLY = 0, mMoved = false;
chunkCanvas.addEventListener('mousedown', e => { if (e.target.closest('#zoom-controls') || e.target.closest('#panel')) return; mDrag = true; mMoved = false; mLX = e.clientX; mLY = e.clientY; });
window.addEventListener('mousemove', e => { if (!mDrag) return; const dx = e.clientX-mLX, dy = e.clientY-mLY; if (Math.abs(dx)>3||Math.abs(dy)>3) mMoved=true; view.x+=dx; view.y+=dy; mLX=e.clientX; mLY=e.clientY; clampView(); applyView(); });
window.addEventListener('mouseup', () => mDrag = false);
chunkCanvas.addEventListener('click', e => { if (mMoved){mMoved=false;return;} const r=mapArea.getBoundingClientRect(); onMapTap(e.clientX, e.clientY); });
chunkCanvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1/1.15); }, { passive: false });

// ===== ズームボタン =====
function bindZoom(el, f) {
  let fired = false;
  const go = e => { e.preventDefault(); e.stopPropagation(); if (fired) return; fired = true; const r = mapArea.getBoundingClientRect(), a = avail(); zoomAt(r.left + r.width/2, r.top + a.h/2, f); setTimeout(() => fired = false, 150); };
  el.addEventListener('touchstart', go, { passive: false });
  el.addEventListener('mousedown', go);
  el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
}
bindZoom($('zoom-in'),  1.4);
bindZoom($('zoom-out'), 1/1.4);

// ===== ジャンプ =====
$('btn-jump').addEventListener('click', doJump);

// ===== 初期化 =====
function init() {
  fitView();
  fetchChunks();
  setInterval(fetchChunks, 10000);
  refreshOutside();
  setInterval(refreshOutside, 5000);
  // リストの初期表示制御
  $('country-list').style.display = 'none';
}
window.addEventListener('resize', fitView);
window.addEventListener('load', () => { fitView(); setTimeout(fitView, 50); setTimeout(fitView, 200); init(); });
if (mapImg.complete) fitView(); else mapImg.addEventListener('load', fitView);
</script>
